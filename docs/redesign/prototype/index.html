<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Budget Prototype</title>
    <!--
  DESIGN-01/02 prototype: fictional data only, no connection to Actual's code.
  Open with a local file URL after `yarn install` (fonts load from node_modules).
  URL params: layout=a|b, header=cards|trend, theme=light|dark|midnight|custom,
  panel=0|1, privacy=0|1, controls=0|1, page=budget|account|reports
  APP-03: rview=dash|networth|custom|calendar|formula, redit=0|1, whover=<widget id>
  APP-03c: rgraph=table|bar|stacked|line|area|donut, rlegend=0|1, rsummary=0|1, rlabels=0|1
  DESIGN-02: data=basic|states|many, density=50|44|38, rta=pos|zero|neg,
  when=past|current|future, cat=<category id>, pm=<panel month>, hover=<id>, edit=<id>:<month>,
  compact=1, hidden=0, collapsed=<group ids>, pane=open|collapsed, recon=0|diff|done,
  filter=<id>:<month>, menu=accounts|more|budget|drawer|breakdown|balance|
  catmenu|groupmenu|month|column|recon with for=<anchor id>
-->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Redacted Script';
        src: url('../../../node_modules/@fontsource/redacted-script/files/redacted-script-latin-400-normal.woff2')
          format('woff2');
      }

      /*
   * Proposed Stage 2 theme roles. Names mirror Actual's camelCase theme keys.
   * Existing-role equivalents are noted where one exists.
   */
      :root,
      [data-theme='light'] {
        --pageBackground: #f4f4f7; /* existing: pageBackground */
        --pageGlow: radial-gradient(
          1100px 420px at 8% -18%,
          rgba(135, 25, 224, 0.07),
          transparent 60%
        );
        --pageText: #15151c; /* existing: pageText */
        --pageTextSubdued: #62626e; /* existing: pageTextSubdued */
        --pageTextFaint: #8d8d99;
        --cardBackground: #ffffff; /* existing: cardBackground */
        --cardBorder: rgba(15, 15, 30, 0.07);
        --cardShadow:
          0 1px 2px rgba(15, 15, 30, 0.04), 0 10px 28px rgba(15, 15, 30, 0.05);
        --cardInset: #f6f6f9;
        --controlBackground: #ffffff;
        --navTrack: rgba(15, 15, 30, 0.05);
        --navActive: #ffffff;
        --navActiveShadow: 0 1px 3px rgba(15, 15, 30, 0.12);
        --accent: #8719e0; /* existing: buttonPrimaryBackground */
        --selectionBackground: rgba(135, 25, 224, 0.06);
        --selectionBorder: #8719e0;
        --tableRowHover: rgba(15, 15, 30, 0.025);
        --groupRowBackground: #fafafc;
        --progressTrack: rgba(15, 15, 30, 0.07);
        --pillPositiveBackground: rgba(20, 125, 100, 0.11);
        --pillPositiveText: #0f6e57; /* derived from numberPositive #147d64 for AA on tint */
        --pillNeutralBackground: rgba(15, 15, 30, 0.05);
        --pillNeutralText: #6b6b76;
        --pillNegativeBackground: rgba(225, 45, 57, 0.11);
        --pillNegativeText: #c21f2c; /* numberNegative */
        --heroGlow: rgba(20, 125, 100, 0.12);
        --popoverShadow:
          0 16px 40px rgba(15, 15, 30, 0.16), 0 2px 6px rgba(15, 15, 30, 0.06);
        --scrim: rgba(15, 15, 30, 0.28);
        --categoryAccent1: #6366f1;
        --categoryAccent2: #10b981;
        --categoryAccent3: #d97706;
        --categoryAccent4: #3b82f6;
        --categoryAccent5: #db2777;
        --categoryAccent6: #ea580c;
        --categoryAccent7: #0891b2;
        --categoryAccent8: #7c3aed;
        --categoryAccent9: #65a30d;
        --categoryAccent10: #e11d48;
        --tileAlpha: 0.13;
      }
      [data-theme='dark'] {
        --pageBackground: #0b0b0f;
        --pageGlow:
          radial-gradient(
            1100px 460px at 12% -12%,
            rgba(129, 140, 248, 0.13),
            transparent 60%
          ),
          radial-gradient(
            800px 420px at 100% -5%,
            rgba(236, 72, 153, 0.06),
            transparent 60%
          );
        --pageText: #f4f4f6;
        --pageTextSubdued: #a3a3ad;
        --pageTextFaint: #74747f;
        --cardBackground: #141419;
        --cardBorder: rgba(255, 255, 255, 0.065);
        --cardShadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 18px 36px rgba(0, 0, 0, 0.32);
        --cardInset: rgba(255, 255, 255, 0.04);
        --controlBackground: #16161c;
        --navTrack: #141419;
        --navActive: rgba(255, 255, 255, 0.1);
        --navActiveShadow: none;
        --accent: #a78bfa;
        --selectionBackground: rgba(129, 140, 248, 0.11);
        --selectionBorder: #818cf8;
        --tableRowHover: rgba(255, 255, 255, 0.025);
        --groupRowBackground: rgba(255, 255, 255, 0.02);
        --progressTrack: rgba(255, 255, 255, 0.075);
        --pillPositiveBackground: rgba(74, 222, 128, 0.13);
        --pillPositiveText: #4ade80;
        --pillNeutralBackground: rgba(255, 255, 255, 0.06);
        --pillNeutralText: #a3a3ad;
        --pillNegativeBackground: rgba(248, 113, 113, 0.15);
        --pillNegativeText: #f87171;
        --heroGlow: rgba(74, 222, 128, 0.2);
        --popoverShadow:
          0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --scrim: rgba(0, 0, 0, 0.5);
        --categoryAccent1: #818cf8;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #60a5fa;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #a78bfa;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.17;
      }
      [data-theme='midnight'] {
        --pageBackground: #0a0812;
        --pageGlow: radial-gradient(
          1100px 460px at 12% -12%,
          rgba(135, 25, 224, 0.2),
          transparent 60%
        );
        --pageText: #efeaf8;
        --pageTextSubdued: #a59cba;
        --pageTextFaint: #766e8a;
        --cardBackground: #13101d;
        --cardBorder: rgba(200, 170, 255, 0.08);
        --cardShadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 18px 36px rgba(0, 0, 0, 0.4);
        --cardInset: rgba(200, 170, 255, 0.05);
        --controlBackground: #15111f;
        --navTrack: #13101d;
        --navActive: rgba(163, 104, 252, 0.2);
        --navActiveShadow: none;
        --accent: #b58cff;
        --selectionBackground: rgba(163, 104, 252, 0.13);
        --selectionBorder: #a368fc;
        --tableRowHover: rgba(200, 170, 255, 0.03);
        --groupRowBackground: rgba(200, 170, 255, 0.03);
        --progressTrack: rgba(200, 170, 255, 0.09);
        --pillPositiveBackground: rgba(74, 222, 128, 0.13);
        --pillPositiveText: #4ade80;
        --pillNeutralBackground: rgba(200, 170, 255, 0.07);
        --pillNeutralText: #a59cba;
        --pillNegativeBackground: rgba(248, 113, 113, 0.15);
        --pillNegativeText: #f87171;
        --heroGlow: rgba(74, 222, 128, 0.18);
        --popoverShadow:
          0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(200, 170, 255, 0.08);
        --scrim: rgba(0, 0, 0, 0.55);
        --categoryAccent1: #a5b4fc;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #7dd3fc;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #c4b5fd;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.18;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-feature-settings: 'ss01', 'ss04';
        background: var(--pageGlow), var(--pageBackground);
        background-attachment: fixed;
        color: var(--pageText);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .num {
        font-feature-settings: 'tnum', 'ss01', 'ss04';
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      body.privacy .num {
        font-family: 'Redacted Script', sans-serif;
        letter-spacing: 0;
      }
      :focus-visible {
        outline: 2px solid var(--selectionBorder);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* Prototype controls (not part of the design) */
      .proto {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 14px;
        background: #1d1d24;
        color: #ddd;
        font-size: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
      }
      .proto b {
        color: #888;
        font-weight: 600;
        margin-right: 4px;
      }
      .proto button {
        padding: 4px 8px;
        border-radius: 7px;
        color: #bbb;
      }
      .proto button.on {
        background: #8719e0;
        color: #fff;
      }
      .proto .grp {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      body.no-controls .proto {
        display: none;
      }

      /* App frame */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 60px;
        padding: 0 24px;
        flex-shrink: 0;
        position: relative;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: white;
        font-size: 13px;
        font-weight: 800;
      }
      [data-theme='dark'] .brand-mark,
      [data-theme='midnight'] .brand-mark {
        color: #1a1030;
      }
      .nav {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 13px;
        background: var(--navTrack);
        border: 1px solid var(--cardBorder);
      }
      [data-theme='light'] .nav {
        border-color: transparent;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--pageTextSubdued);
        position: relative;
      }
      .nav button:hover {
        color: var(--pageText);
      }
      .nav button.on {
        background: var(--navActive);
        color: var(--pageText);
        font-weight: 600;
        box-shadow: var(--navActiveShadow);
      }
      .nav button.open {
        color: var(--pageText);
        background: var(--tableRowHover);
      }
      .nav .chev {
        opacity: 0.6;
      }
      .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--pageTextSubdued);
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
        position: relative;
      }
      .icon-btn:hover {
        color: var(--pageText);
      }
      .icon-btn.burger {
        display: none;
      }
      .uncat {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--pageText);
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
      }
      .uncat .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--categoryAccent3);
      }
      .sync-dot {
        position: absolute;
        right: 6px;
        top: 6px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pillPositiveText);
        box-shadow: 0 0 0 2px var(--controlBackground);
      }
      .switcher {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px 0 5px;
        border-radius: 10px;
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
        font-size: 13px;
        font-weight: 600;
      }
      .switcher .av {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--selectionBackground);
        color: var(--accent);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
      }

      /* Popovers */
      .pop {
        position: absolute;
        top: 52px;
        z-index: 30;
        min-width: 220px;
        padding: 6px;
        border-radius: 16px;
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        box-shadow: var(--popoverShadow);
        display: none;
      }
      .pop.show {
        display: block;
      }
      .pop .sec {
        padding: 8px 10px 4px;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pageTextFaint);
        display: flex;
        justify-content: space-between;
      }
      .pop .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13.5px;
        text-align: left;
      }
      .pop .item:hover,
      .pop .item.hl {
        background: var(--tableRowHover);
      }
      .pop .item .amt {
        margin-left: auto;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .pop .item .amt.neg {
        color: var(--pillNegativeText);
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--cardBorder);
        margin: 6px 4px;
      }
      .pop .ico {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--cardInset);
        color: var(--pageTextSubdued);
        flex-shrink: 0;
      }
      .pop .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 10px 8px;
      }
      .pop .total b {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .pop .muted {
        color: var(--pageTextFaint);
        font-size: 12px;
      }
      .pop .acct-status {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #pop-accounts {
        width: 320px;
      }
      #pop-more {
        width: 230px;
      }
      #pop-budget {
        width: 230px;
        right: 24px;
      }

      /* Page */
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 18px;
        padding: 4px 24px 20px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .head {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .eyebrow {
        font-size: 12.5px;
        color: var(--pageTextFaint);
        font-weight: 500;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .head-controls {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
      }
      .seg > button {
        height: 30px;
        min-width: 30px;
        padding: 0 8px;
        border-radius: 9px;
        color: var(--pageTextSubdued);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
      }
      .seg > button:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .seg .label {
        padding: 0 10px;
        color: var(--pageText);
      }
      .months button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }
      [data-theme='light'] .months {
        background: var(--navTrack);
        border-color: transparent;
      }

      .card {
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        border-radius: 18px;
        box-shadow: var(--cardShadow);
      }

      /* Summary cards */
      .summary {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 12px;
        flex-shrink: 0;
      }
      .stat {
        padding: 16px 18px;
        position: relative;
        overflow: hidden;
      }
      .stat .label {
        font-size: 12.5px;
        color: var(--pageTextSubdued);
        font-weight: 500;
      }
      .stat .value {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-top: 4px;
      }
      .stat .sub {
        font-size: 12px;
        color: var(--pageTextFaint);
        margin-top: 3px;
      }
      .stat.hero {
        cursor: pointer;
      }
      .stat.hero::after {
        content: '';
        position: absolute;
        right: -70px;
        top: -90px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--heroGlow), transparent 65%);
        pointer-events: none;
      }
      .stat.hero .value {
        color: var(--pillPositiveText);
        font-size: 30px;
      }
      .stat.hero .more {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextSubdued);
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--cardInset);
      }
      .stackbar {
        display: flex;
        gap: 2px;
        height: 7px;
        margin-top: 12px;
        border-radius: 99px;
        overflow: hidden;
      }
      .stackbar i {
        display: block;
        height: 100%;
      }

      /* Trend header (Concept C) */
      .summary.trend {
        grid-template-columns: 1.55fr 1fr;
      }
      .trendcard {
        padding: 16px 18px 12px;
        display: flex;
        flex-direction: column;
      }
      .trendcard .row-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .delta {
        font-size: 12px;
        font-weight: 600;
        color: var(--pillPositiveText);
        background: var(--pillPositiveBackground);
        padding: 3px 8px;
        border-radius: 99px;
        vertical-align: middle;
        margin-left: 6px;
        letter-spacing: 0;
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--pageTextFaint);
        margin-top: 4px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 3px;
        border-radius: 2px;
        vertical-align: middle;
        margin-right: 5px;
      }
      .stack2 {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
      }
      .stack2 .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
      }
      .stack2 .stat .value {
        font-size: 24px;
      }
      .stack2 .stat.hero .value {
        font-size: 26px;
      }
      .ring {
        width: 54px;
        height: 54px;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      /* Ledger */
      .ledger-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        border-radius: 18px;
      }
      .ledger {
        overflow: hidden;
      }
      .cols {
        display: grid;
        grid-template-columns:
          minmax(160px, 1fr) 120px minmax(150px, 230px)
          120px;
        column-gap: 20px;
        align-items: center;
        padding: 0 18px;
      }
      .lhead {
        height: 40px;
        font-size: 11px;
        font-weight: 650;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        border-bottom: 1px solid var(--cardBorder);
        position: sticky;
        top: 0;
        background: var(--cardBackground);
        z-index: 2;
      }
      .r {
        text-align: right;
      }
      .grow {
        height: 44px;
        font-weight: 650;
        font-size: 13.5px;
        background: var(--groupRowBackground);
        border-bottom: 1px solid var(--cardBorder);
      }
      .grow .name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .caret {
        color: var(--pageTextFaint);
        width: 14px;
        display: grid;
        place-items: center;
      }
      .crow {
        height: 50px;
        border-bottom: 1px solid var(--cardBorder);
        position: relative;
      }
      .crow:last-child {

      /* ===================== DESIGN-02 additions ===================== */

      /* Warning pill: template underfunded (existing role templateNumberUnderFunded) */
      :root,
      [data-theme='light'] {
        --pillWarningBackground: rgba(217, 119, 6, 0.12);
        --pillWarningText: #a15c07;
        --heroGlowNegative: rgba(225, 45, 57, 0.1);
      }
      [data-theme='dark'] {
        --pillWarningBackground: rgba(251, 191, 36, 0.14);
        --pillWarningText: #fbbf24;
        --heroGlowNegative: rgba(248, 113, 113, 0.16);
      }
      [data-theme='midnight'] {
        --pillWarningBackground: rgba(251, 191, 36, 0.14);
        --pillWarningText: #fbbf24;
        --heroGlowNegative: rgba(248, 113, 113, 0.16);
      }

      /*
       * Custom theme test. A custom theme loads on top of a built-in base
       * (dark here) and overrides EXISTING roles only. The second half is the
       * proposed UI-01 fallback layer: every new role is derived from an
       * existing role, so the new surfaces follow the custom palette.
       */
      [data-theme='custom'] {
        /* What the custom theme itself sets (existing Actual roles) */
        --x-pageBackground: #002b36;
        --x-pageText: #eee8d5;
        --x-pageTextSubdued: #93a1a1;
        --x-cardBackground: #073642;
        --x-tableBorder: rgba(147, 161, 161, 0.2);
        --x-buttonPrimaryBackground: #b58900;
        --x-numberPositive: #859900;
        --x-numberNegative: #dc322f;
        --x-templateNumberUnderFunded: #cb4b16;

        /* Fallback layer: new roles expressed through existing ones */
        --pageBackground: var(--x-pageBackground);
        --pageGlow: none;
        --pageText: var(--x-pageText);
        --pageTextSubdued: var(--x-pageTextSubdued);
        --pageTextFaint: color-mix(
          in srgb,
          var(--x-pageTextSubdued) 70%,
          var(--x-pageBackground)
        );
        --cardBackground: var(--x-cardBackground);
        --cardBorder: var(--x-tableBorder);
        --cardShadow: none;
        --cardInset: color-mix(in srgb, var(--x-pageText) 6%, transparent);
        --controlBackground: var(--x-cardBackground);
        --navTrack: var(--x-cardBackground);
        --navActive: color-mix(in srgb, var(--x-pageText) 12%, transparent);
        --navActiveShadow: none;
        --accent: var(--x-buttonPrimaryBackground);
        --selectionBackground: color-mix(
          in srgb,
          var(--x-buttonPrimaryBackground) 16%,
          transparent
        );
        --selectionBorder: var(--x-buttonPrimaryBackground);
        --tableRowHover: color-mix(in srgb, var(--x-pageText) 4%, transparent);
        --groupRowBackground: color-mix(
          in srgb,
          var(--x-pageText) 3%,
          transparent
        );
        --progressTrack: color-mix(in srgb, var(--x-pageText) 10%, transparent);
        --pillPositiveBackground: color-mix(
          in srgb,
          var(--x-numberPositive) 18%,
          transparent
        );
        --pillPositiveText: var(--x-numberPositive);
        --pillNeutralBackground: color-mix(
          in srgb,
          var(--x-pageText) 8%,
          transparent
        );
        --pillNeutralText: var(--x-pageTextSubdued);
        --pillNegativeBackground: color-mix(
          in srgb,
          var(--x-numberNegative) 18%,
          transparent
        );
        --pillNegativeText: var(--x-numberNegative);
        --pillWarningBackground: color-mix(
          in srgb,
          var(--x-templateNumberUnderFunded) 18%,
          transparent
        );
        --pillWarningText: var(--x-templateNumberUnderFunded);
        --heroGlow: transparent;
        --heroGlowNegative: transparent;
        --popoverShadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        --scrim: rgba(0, 0, 0, 0.5);
        /* Category accents are not overridden: the built-in dark set shows */
        --categoryAccent1: #818cf8;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #60a5fa;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #a78bfa;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.17;
      }
      [data-theme='custom'] .brand-mark,
      [data-theme='custom'] .tbtn.primary {
        color: #002b36;
      }

      .proto {

      }
      .d38 .crow .name {
        gap: 9px;
      }

      /* Category name cell: dedicated details opener, tools on hover */
      .crow .name,
      .grow .name {
        position: relative;
      }
      .cname {
        display: flex;
        align-items: center;
        gap: inherit;
        min-width: 0;
        flex: 1;
        text-align: left;
        border-radius: 8px;
        padding: 2px 0;
      }
      .cname.static {
        cursor: default;
      }
      .crow .name .ntext {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.2;
      }
      .crow .name .nlabel {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crow .name span {
        white-space: nowrap;
      }
      .cname:hover .nlabel {
        text-decoration: underline;
        text-decoration-color: var(--pageTextFaint);
        text-underline-offset: 3px;
      }
      .cap {
        font-size: 11px;
        font-weight: 500;
        color: var(--pageTextFaint);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hid {
        font-size: 10.5px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--pageTextFaint);
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--cardInset);
        flex-shrink: 0;
      }
      .crow.hidden-cat .name,
      .crow.hidden-cat .r,
      .crow.hidden-cat .act {
        opacity: 0.5;
      }
      .drag {
        position: absolute;
        left: 2px;
        color: var(--pageTextFaint);
        opacity: 0;
        display: grid;
        cursor: grab;
      }
      /* Row tools take no width until hover or keyboard focus */
      .tools {
        display: none;
        gap: 2px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .crow:hover .tools,
      .crow.hover .tools,
      .crow:focus-within .tools,
      .grow:hover .tools,
      .grow:focus-within .tools {
        display: flex;
      }
      .note-ind {
        display: grid;
        color: var(--pageTextFaint);
        flex-shrink: 0;
      }
      .crow:hover .note-ind,
      .crow.hover .note-ind,
      .crow:focus-within .note-ind {
        display: none;
      }
      .tool {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: var(--pageTextFaint);
        opacity: 0;
      }
      .tool:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .tool.on {
        opacity: 1;
        color: var(--pageTextSubdued);
      }
      .crow:hover .tool,
      .crow.hover .tool,
      .crow:focus-within .tool,
      .grow:hover .tool,
      .grow:focus-within .tool,
      .lhead .tool,
      .mcard .tool,
      .acct-rail .tool,
      .crow:hover .drag,
      .crow.hover .drag {
        opacity: 1;
      }
      .crow.hover {
        background: var(--tableRowHover);
      }
      .crow.hover .assigned {
        box-shadow: inset 0 0 0 1px var(--cardBorder);
        background: var(--controlBackground);
      }
      .crow .assigned {
        cursor: text;
      }
      .assigned.z,
      .z {
        color: var(--pageTextFaint);
      }
      .ch-name {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ch-name .tool {
        width: 20px;
        height: 20px;
      }
      .grow .gname {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .caret {
        border-radius: 6px;
        height: 20px;
      }
      .caret:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }

      /* Editing the Assigned amount */
      .amt-input {
        width: 100%;
        max-width: 110px;
        height: 30px;
        text-align: right;
        font: inherit;
        font-weight: 600;
        color: var(--pageText);
        background: var(--controlBackground);
        border: 1.5px solid var(--selectionBorder);
        border-radius: 8px;
        padding: 0 8px;
        outline: 3px solid var(--selectionBackground);
        font-feature-settings: 'tnum';
      }
      .d38 .amt-input {
        height: 26px;
      }
      .crow.editing {
        background: var(--selectionBackground);
      }

      /* Activity link, pills, goal and carryover markers */
      .actlink {
        border-radius: 6px;
      }
      .actlink:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      button.pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 650;
      }
      button.pill:hover {
        box-shadow: inset 0 0 0 1px currentColor;
      }
      .pill.warn {
        background: var(--pillWarningBackground);
        color: var(--pillWarningText);
      }
      .pill .gi,
      .pill .carry {
        display: inline-grid;
        opacity: 0.85;
      }
      .goalbox {
        padding: 11px 12px;
        border-radius: 12px;
        background: var(--cardInset);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gb-top {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .goalbox.under .gb-top {
        color: var(--pillWarningText);
      }
      .goalbox.ok .gb-top {
        color: var(--pillPositiveText);
      }
      .gb-top .gi {
        display: grid;
      }
      .gb-sub {
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .goalbox .bar {
        height: 5px;
      }
      .flag {
        display: flex;
        gap: 7px;
        align-items: flex-start;
        margin-top: 6px;
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .flag svg {
        margin-top: 2px;
        flex-shrink: 0;
      }
      .big.neg {
        color: var(--pillNegativeText);
      }
      .big.zero {
        color: var(--pageTextSubdued);
      }

      /* Ready to Assign states */
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0;
        background: var(--pillNeutralBackground);
        color: var(--pillNeutralText);
        vertical-align: 1px;
      }
      .badge.neg {
        background: var(--pillNegativeBackground);
        color: var(--pillNegativeText);
      }
      .stat.hero.zero .value {
        color: var(--pageText);
      }
      .stat.hero.zero::after {
        display: none;
      }
      .stat.hero.neg .value {
        color: var(--pillNegativeText);
      }
      .stat.hero.neg::after {
        background: radial-gradient(
          circle,
          var(--heroGlowNegative),
          transparent 65%
        );
      }
      .stat.hero:focus-visible {
        outline-offset: 2px;
        border-radius: 18px;
      }

      /* Compact summary strip, shown once the table scrolls on short windows */
      .cstrip {
        display: none;
        align-items: center;
        gap: 22px;
        height: 46px;
        padding: 0 8px 0 6px;
        flex-shrink: 0;
        border-radius: 14px;
      }
      body.compact .summary.cards {
        display: none;
      }
      body.compact .cstrip {
        display: flex;
      }
      .cs-rta {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--cardInset);
      }
      .cstrip .l {
        font-size: 12.5px;
        color: var(--pageTextSubdued);
        font-weight: 500;
      }
      .cstrip b {
        font-size: 16px;
        font-weight: 700;
      }
      .cs-rta.pos b {
        color: var(--pillPositiveText);
      }
      .cs-rta.neg b {
        color: var(--pillNegativeText);
      }
      .cs-rta .badge {
        margin-left: 0;
      }
      .cs-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      /* Breakdown and anchored menus */
      .pop.apop {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 60;
        max-width: calc(100vw - 24px);
      }
      .bd {
        padding: 4px 4px 2px;
      }
      .bd-title {
        font-size: 12px;
        font-weight: 650;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 6px 6px 8px;
      }
      .bd-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 6px;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .bd-row .num {
        color: var(--pageText);
        font-weight: 550;
      }
      .bd-row.total {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid var(--cardBorder);
        font-weight: 650;
        color: var(--pageText);
        font-size: 14px;
      }
      .bd-row.total.pos .num {
        color: var(--pillPositiveText);
      }
      .bd-row.total.neg .num {
        color: var(--pillNegativeText);
      }

      /* Multi-month */
      .mstart {
        position: relative;
      }
      .mstart::before {
        content: '';
        position: absolute;
        left: calc(var(--gap, 20px) / -2);
        top: -40px;
        bottom: -40px;
        width: 1px;
        background: var(--cardBorder);
      }
      .cols {
        overflow: hidden;
      }
      .mhead {
        height: 34px;
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--cardBackground);
        font-size: 13px;
        font-weight: 650;
      }
      .multi .lhead {
        top: 34px;
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .today {
        font-size: 10.5px;
        font-weight: 650;
        padding: 2px 7px;
        border-radius: 99px;
        background: var(--selectionBackground);
        color: var(--accent);
        text-transform: none;
        letter-spacing: 0;
      }
      .msummary {
        display: grid;
        align-items: stretch;
        padding: 0 19px;
        flex-shrink: 0;
      }
      .ms-lead {
        align-self: center;
      }
      .ms-hint {
        font-size: 12px;
        color: var(--pageTextFaint);
        margin-top: 2px;
        max-width: 170px;
      }
      .mcard {
        padding: 10px 12px 11px;
        border-radius: 14px;
        margin-left: calc(var(--gap, 20px) / -2);
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .mcard.focus {
        box-shadow:
          var(--cardShadow),
          inset 0 0 0 1px var(--selectionBorder);
      }
      .mc-top {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .mc-tools {
        margin-left: auto;
        display: flex;
        gap: 2px;
      }
      .mc-rta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        text-align: left;
        border-radius: 8px;
        flex-wrap: wrap;
      }
      .mc-rta .l {
        font-size: 12px;
        color: var(--pageTextSubdued);
        width: 100%;
      }
      .mc-rta .v {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .mc-rta .badge {
        margin-left: 0;
      }
      .mcard.pos .v {
        color: var(--pillPositiveText);
      }
      .mcard.neg .v {
        color: var(--pillNegativeText);
      }
      .mc-line {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 11.5px;
        color: var(--pageTextFaint);
      }
      .multi .act .t {
        justify-content: flex-start;
      }
      @media (max-width: 1279px) {
        .msummary {
          padding: 0 15px;
        }
        .mc-rta .v {
          font-size: 18px;
        }
        .multi-month .ms-hint {
          display: none;
        }
        .multi-month .cols .pill {
          padding: 3px 8px;
          font-size: 12px;
        }
      }

      /* Income section */
      .grow.inc {
        margin-top: 0;
      }
      .rl {
        font-size: 11px;
        font-weight: 600;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-right: 6px;
      }
      .irow .r {
        font-weight: 550;
      }

      /* Details panel: rail and overlay modes for multi-month views */
      .page {
        position: relative;
      }
      .rail {
        width: 62px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        align-self: flex-start;
      }
      .rail-tile {
        border-radius: 10px;
      }
      .rail-label {
        writing-mode: vertical-rl;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextFaint);
        letter-spacing: 0.04em;
      }
      .detail.overlay {
        position: absolute;
        right: 24px;
        top: 62px;
        bottom: 20px;
        z-index: 25;
        box-shadow: var(--popoverShadow);
      }
      .d-head {
        min-width: 0;
      }
      .d-title {
        overflow-wrap: anywhere;
        line-height: 1.2;
      }
      .d-month {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        vertical-align: middle;
      }
      .d-month button {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .d-month button:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .d-month b {
        color: var(--pageTextSubdued);
        font-weight: 600;
      }
      .chart {
        position: relative;
      }
      .chart-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--pageTextFaint);
      }
      .chart-empty span {
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--cardBackground);
        box-shadow: 0 0 0 1px var(--cardBorder);
      }
      .legend {
        flex-wrap: wrap;
        row-gap: 2px;
      }
      .legend span {
        white-space: nowrap;
      }
      .crow .name .ntext {
        min-width: 48px;
      }
      .multi .crow .cap {
        display: none;
      }
      .legend i.dash {
        width: 1px;
        height: 10px;
        background: var(--pageTextFaint);
      }
      .pace-sum {
        color: var(--pageTextSubdued);
        font-weight: 600;
      }
      .txn .amt.in {
        color: var(--pillPositiveText);
      }
      .muted {
        color: var(--pageTextFaint);
      }
      .linkbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        border-radius: 6px;
      }
      .head .seg button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }

      /* Pinned accounts rail (optional, replaces the sidebar's pin) */
      .acct-rail {
        width: 236px;
        flex-shrink: 0;
        padding: 10px 6px;
        overflow: auto;
        align-self: stretch;
      }
      .acct-rail.collapsed {
        width: 56px;
        padding: 10px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .ap-dot {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--pageTextSubdued);
        background: var(--cardInset);
      }
      .ap-dot:hover {
        color: var(--pageText);
        background: var(--tableRowHover);
      }
      .ap-dot .acct-status {
        position: absolute;
        right: -1px;
        top: -1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--cardBackground);
      }
      .acct-rail .ar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 8px 6px 10px;
        font-size: 13px;
      }
      .acct-rail .pop {
        position: static;
        display: block;
        box-shadow: none;
        border: 0;
        padding: 0;
        width: auto;
        min-width: 0;
        background: transparent;
      }
      .acct-rail .pop .item,
      .drawer .pop .item {
        white-space: nowrap;
      }
      .acct-rail .pop .item {
        padding: 7px 8px;
        font-size: 13px;
      }
      .pin-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 650;
        color: var(--pageTextSubdued);
        text-transform: none;
        letter-spacing: 0;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .pin-btn:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }

      /* Reconciliation mode in the account hero */
      .recon {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--cardInset);
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .recon b {
        color: var(--pageText);
      }
      .recon-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .chip.neg {
        background: var(--pillNegativeBackground);
        color: var(--pillNegativeText);
      }
      .chip.neg b {
        color: inherit;
      }
      .acct-hero.reconciling {
        box-shadow:
          var(--cardShadow),
          inset 0 0 0 1.5px var(--selectionBorder);
      }
      .register.reconciling .clr-head {
        color: var(--accent);
      }
      .register.reconciling .clr.u {
        border-color: var(--accent);
      }
      .rc {
        width: 290px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .rc-input {
        height: 36px;
        border-radius: 10px;
        border: 1.5px solid var(--selectionBorder);
        background: var(--controlBackground);
        color: var(--pageText);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-align: right;
        padding: 0 10px;
      }
      .rc-bank {
        text-align: right;
        font-size: 12px;
      }
      .rc-bank b {
        color: var(--pageText);
      }
      .rc-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .filter-pill button {
        display: grid;
        place-items: center;
        border-radius: 99px;
        width: 18px;
        height: 18px;
      }
      @media (max-width: 1279px) {
        .recon-actions {
          margin-left: 0;
        }
        .acct-rail {
          width: 210px;
        }
      }
      @media (max-width: 899px) {
        .rail {
          display: none;
        }
        .cstrip .cs-item:last-child {
          display: none;
        }
      }
      /* Accounts pane and details panel both open: narrower Activity */
      @media (min-width: 1280px) {
        body.pane-open.panel-open .cols {
          grid-template-columns:
            minmax(150px, 1fr) 104px minmax(100px, 170px)
            108px;
          column-gap: 16px;
        }
        body.pane-open.panel-open .act .t .pct {
          display: none;
        }
      }
      @media (max-width: 1279px) and (min-width: 900px) {
        body.panel-open .cols {
          grid-template-columns:
            minmax(120px, 1fr) 84px minmax(72px, 120px)
            92px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .bar i {
          transition: width 0.2s ease;
        }
      }

      /*
   * APP-03 proposal: Reports. Chart and amount colours are Actual's existing
   * reports* and number roles, unchanged (owner decision, September 30, 2026).
   * Widget cards are hairline only, with no shadow (same decision).
   */
      :root,
      [data-theme='light'] {
        --reportsPos: #147d64; /* reportsNumberPositive = numberPositive */
        --reportsNeg: #e12d39; /* reportsNumberNegative = numberNegative */
        --reportsGreen: #3ebd93;
        --reportsRed: #f86a6a;
        --reportsGray: #747c8b;
      }
      [data-theme='dark'],
      [data-theme='midnight'] {
        --reportsPos: #65d6ad;
        --reportsNeg: #ff9b9b;
      }
      [data-theme='custom'] {
        --reportsPos: var(--x-numberPositive);
        --reportsNeg: var(--x-numberNegative);
      }
      .rmain {
        overflow-y: auto;
        padding-right: 2px;
      }
      .rgrid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 88px;
        gap: 14px;
        flex-shrink: 0;
      }
      .wcard,
      .rcard {
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        border-radius: 18px;
        min-width: 0;
        position: relative;
      }
      .wcard {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        text-align: left;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: no-preference) {
        .wcard {
          transition: border-color 0.15s;
        }
      }
      .wcard:hover,
      .wcard.hover {
        border-color: color-mix(in srgb, var(--pageText) 16%, transparent);
      }
      .w-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        /* room for the widget menu, so it never covers a value */
        padding-right: 26px;
      }
      .w-top > div:first-child {
        min-width: 0;
        flex: 1;
      }
      .w-title {
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;

    <script>
      const params = new URLSearchParams(location.search);

        filter: params.get('filter') || '',
        recon: params.get('recon') || '0',
        // APP-03: reports view (dashboard or the Net Worth report page),
        // dashboard edit mode, and a hovered widget for screenshots.

                `${i ? 'L' : 'M'}${x(d).toFixed(1)},${y(v).toFixed(1)}`,
            )
            .join(' ');
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="margin-top:8px" role="img" aria-label="Spending this month is below last month's pace">
      <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--categoryAccent1)" stop-opacity=".35"/><stop offset="1" stop-color="var(--categoryAccent1)" stop-opacity="0"/></linearGradient></defs>
      <path d="${p(
        prev,
      )}" fill="none" stroke="var(--pageTextFaint)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path d="${p(cur)} L${x(26)},${h} L0,${h} Z" fill="url(#tg)"/>
      <path d="${p(
        cur,
      )}" fill="none" stroke="var(--categoryAccent1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
      }

      function summaryTrend() {
        return `<section class="summary trend" aria-label="Month summary">
      <div class="card trendcard">
        <div class="row-top"><div>
          <div class="label" style="font-size:12.5px;color:var(--pageTextSubdued);font-weight:500">Activity this month</div>
          <div class="num" style="font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:3px">${fmt(
            -totS,
          )}<span class="delta">$520 less than August</span></div>
        </div></div>
        ${trendSvg()}
        <div class="legend"><span><i style="background:var(--categoryAccent1)"></i>September</span><span><i style="background:var(--pageTextFaint)"></i>August</span></div>
      </div>
      <div class="stack2">
        <div class="card stat hero" role="button" tabindex="0"><div><div class="label">Ready to Assign</div><div class="value num">${fmt(
          1000,
        )}</div></div>${ring(0.81, 'var(--pillPositiveText)')}</div>
        <div class="card stat"><div><div class="label">Assigned</div><div class="value num">${fmt(
          totB,
        )}</div></div>${ring(0.58, 'var(--categoryAccent1)')}</div>
      </div>
    </section>`;
      }

      // ---- Month model (illustration only; the app reads these from the spreadsheet) ----
      const TODAY_DAY = 27; // "today" is September 27, 2026 (month offset 0)
      const mDate = off => new Date(2026, 8 + off, 1);
      const mLong = off =>
        mDate(off).toLocaleString('en-US', { month: 'long', year: 'numeric' });
      const mShort = off =>
        mDate(off).toLocaleString('en-US', { month: 'short', year: 'numeric' });
      const mName = off =>
        mDate(off).toLocaleString('en-US', { month: 'long' });
      const mAbbr = off =>
        mDate(off).toLocaleString('en-US', { month: 'short' });
      const daysIn = off => new Date(2026, 9 + off, 0).getDate();
      const WHEN = { past: -1, current: 0, future: 1 };
      const whenOff = () => WHEN[state.when] ?? (Number(state.when) || 0);
      const offWhen = o =>
        Object.keys(WHEN).find(k => WHEN[k] === o) ?? String(o);
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const esc = s =>
        String(s).replace(
          /[&<>"]/g,
          ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch],
        );
      const fmtC = n =>
        (n < 0 ? '−' : '+') +
        '$' +
        Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2 });

      // Envelope rules as Actual applies them: positive balances carry forward;
      // negative balances carry only when overspending rollover is on,
      // otherwise they reduce next month's Ready to Assign.
      function cell(c, off) {
        let avail = 0,
          out;
        for (let o = -3; o <= off; o++) {
          const carry = avail > 0 || c.roll ? avail : 0;
          let b, s;
          if (o <= -2) [b, s] = [c.b, c.b];
          else if (o === -1) [b, s] = c.aug || [c.b, c.b];
          else if (o === 0) [b, s] = [c.b, c.s];
          else [b, s] = [o === 1 && !c.hidden ? c.b : 0, 0];
          if (c.bo && o in c.bo) b = c.bo[o];
          const extra = o === -2 ? c.jul || 0 : 0;
          avail = carry + extra + b - s;
          out = { b, s, carry: carry + extra, avail };
        }
        return out;
      }
      const rtaNow = { pos: 1000, zero: 0, neg: -240 }[state.rta] ?? 1000;
      const monthTotals = off => ({
        assigned: sum(all, c => cell(c, off).b),
        activity: -sum(all, c => cell(c, off).s),
        over: sum(all, c => {
          const a = cell(c, off).avail;
          return !c.roll && a < 0 ? -a : 0;
        }),
        received: sum(income, i => i.r[off] || 0),
      });
      // Mirrors TotalsList: Available funds − Overspent last month − Assigned − For next month.
      function summaryFor(off) {
        const t = monthTotals(off);
        const prevOver = monthTotals(off - 1).over;
        if (off < 0) {
          return { ...t, prevOver, hold: 0, rta: 0, af: prevOver + t.assigned };
        }
        if (off === 0) {
          const next = monthTotals(1);
          const hold =
            state.rta === 'pos'
              ? Math.max(
                  0,
                  Math.ceil((next.assigned + t.over - rtaNow + 200) / 100) *
                    100,
                )
              : 0;
          return {
            ...t,
            prevOver,
            hold,
            rta: rtaNow,
            af: rtaNow + prevOver + t.assigned + hold,
          };
        }
        const prev = summaryFor(off - 1);
        const af = prev.rta + prev.hold + t.received;
        return { ...t, prevOver, hold: 0, af, rta: af - prevOver - t.assigned };
      }
      function goalInfo(c, off) {
        if (!c.goal) return null;
        const d = cell(c, off);
        if (c.longGoal) {
          const pct = clamp(d.avail / c.goal, 0, 1);
          return {
            under: d.avail < c.goal,
            pct,
            text: `Goal ${fmt(c.goal)} · ${Math.round(pct * 100)}% saved`,
            long: `Long-term goal of ${fmt(c.goal)}. ${fmt(
              c.goal - d.avail,
            )} to go.`,
          };
        }
        const short = c.goal - d.b;
        return {
          under: short > 0,
          pct: clamp(d.b / c.goal, 0, 1),
          text:
            short > 0
              ? `Template ${fmt(c.goal)} · ${fmt(short)} short`
              : `Template ${fmt(c.goal)} · Funded`,
          long:
            short > 0
              ? `Template asks for ${fmt(c.goal)} a month. Underfunded by ${fmt(
                  short,
                )}.`
              : `Template asks for ${fmt(c.goal)} a month. Fully funded.`,
        };
      }
      const availKind = (c, off) => {
        const d = cell(c, off),
          gi = goalInfo(c, off);
        return d.avail < 0
          ? 'neg'
          : gi && gi.under
            ? 'warn'
            : d.avail > 0
              ? 'pos'
              : 'zero';
      };

      // Illustrative transactions, generated so that they add up to each month's activity.
      const payeeNames = {
        'c-rent': ['Landlord Co'],
        'c-dine': ['Noodle Bar', 'Café Luna', 'Pizza Place', 'Taco Stand'],
        'c-util': ['City Power', 'Water Co'],
        'c-trans': ['Metro Card', 'Fuel Stop'],
        'c-subs': ['StreamFlix', 'Cloud Storage'],
        'c-med': ['Pharmacy'],
        'c-cloth': ['Outfitters'],
        'c-kids': ['Swim School', 'Art Club'],
        'c-hobby': ['Music Store', 'Strings Online'],
        'c-home': ['Hardware Hub'],
      };
      const acctNames = ['Checking', 'Credit Card', 'Checking', 'Cash'];
      function txnsFor(c, off) {
        const d = cell(c, off);
        if (off > 0 || d.s === 0) return [];
        const last = off === 0 ? TODAY_DAY : daysIn(off);
        const names = payeeNames[c.id] || ['Corner Shop', 'Online order'];
        if (d.s < 0) {
          return [
            { day: 9, amt: -d.s, p: names[0] + ' refund', a: 'Credit Card' },
          ];
        }
        if (c.id === 'c-groc' && off === 0 && d.s === 240) {
          return [
            { day: 6, amt: -100, p: 'Local Market', a: 'Credit Card' },
            { day: 14, amt: -140, p: 'SuperMart', a: 'Checking' },
          ];
        }
        const k = c.id === 'c-rent' ? 1 : clamp(Math.round(d.s / 70), 1, 5);
        const out = [];
        let left = d.s;
        for (let i = 0; i < k; i++) {
          const amt = i === k - 1 ? left : Math.round(d.s / k);
          left -= amt;
          out.push({
            day:
              c.id === 'c-rent'
                ? 1
                : 1 + (stableHash(c.id + off + ':' + i) % last),
            amt: -amt,
            p: names[i % names.length],
            a: acctNames[(stableHash(c.id + i) >>> 3) % acctNames.length],
          });
        }
        return out.sort((a, b) => a.day - b.day);
      }
      // Pace: money available at the start of the month (carry + assigned),
      // spread evenly over the month, compared with cumulative outflow.
      function paceInfo(c, off) {
        const d = cell(c, off),
          days = daysIn(off);
        const start = d.carry + d.b;
        const tx = txnsFor(c, off);
        const upto = off === 0 ? TODAY_DAY : off < 0 ? days : 0;
        const spent = -sum(
          tx.filter(t => t.day <= upto),
          t => t.amt,
        );
        const expected = start > 0 ? (start * upto) / days : 0;
        return {
          d,
          days,
          start,
          tx,
          upto,
          spent,
          expected,
          diff: expected - spent,
        };
      }

      // ---- Layout: months that fit, and how the panel behaves ----
      // Owner decision (Sep 27, 2026): the budget shows one month at a time.
      function layoutInfo() {
        const w = window.innerWidth;
        const narrow = w < 900;
        const off = whenOff();
        const mode =
          state.page !== 'budget' || !state.panel ? 'closed' : 'push';
        return { w, narrow, fit: 1, n: 1, off, start: off, mode, tpl: '' };
      }
      const L = layoutInfo();
      const offsets = () => Array.from({ length: L.n }, (_, i) => L.start + i);
      const panelOff = () => (state.pm == null ? L.off : state.pm);

      function header() {
        const off = L.off;
        const title =
          L.n === 1
            ? mLong(off)
            : `${mAbbr(L.start)} – ${mShort(L.start + L.n - 1)}`;
        const rel =
          off < 0 ? ' · Past month' : off > 0 ? ' · Future month' : '';
        const monthTools =
          L.n === 1
            ? `<div class="seg"><button aria-label="${mName(off)} notes">${
                I.note
              }</button><button data-menu="month" data-for="${off}" data-anchor="month:${off}" aria-label="${mName(
                off,
              )} budget menu" aria-haspopup="menu">${I.dots}</button></div>`
            : '';
        return `<div class="head">
      <div><div class="eyebrow">Budget${rel}</div><h1>${title}</h1></div>
      <div class="head-controls">
        <div class="seg" role="group" aria-label="Month">
          <button aria-label="Previous month" data-step="-1">${I.chevL}</button>
          <button class="label">${mShort(off)}</button>
          <button aria-label="Next month" data-step="1">${I.chevR}</button>
        </div>
        ${
          off !== 0
            ? '<div class="seg"><button data-set="when" data-val="current">Today</button></div>'
            : ''
        }
        ${monthTools}
        <div class="seg"><button class="${
          state.panel ? 'on' : ''
        }" data-toggle="panel" aria-pressed="${state.panel}" aria-label="${
          state.panel ? 'Hide' : 'Show'
        } category details">${I.panel}</button></div>
      </div>
    </div>`;
      }

      const rtaKind = v => (v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero');
      const rtaBadge = k =>
        k === 'neg'
          ? '<span class="badge neg">Overassigned</span>'
          : k === 'zero'
            ? '<span class="badge">All assigned</span>'
            : '';

      function summaryCards(off) {
        const s = summaryFor(off),
          k = rtaKind(s.rta);
        const spent = all
          .map(c => [c, cell(c, off).s])
          .filter(([, v]) => v > 0)
          .sort((a, b) => b[1] - a[1]);
        const top = spent.slice(0, 6),
          other = sum(spent.slice(6), x => x[1]);
        const sub =
          k === 'pos'
            ? `${fmt(s.af)} available funds`
            : k === 'zero'
              ? 'Every dollar has a job'
              : 'More assigned than you have';
        return `<section class="summary cards" aria-label="Month summary">
      <div class="card stat hero ${k}" role="button" tabindex="0" data-menu="breakdown" data-for="${off}" data-anchor="breakdown:${off}" aria-haspopup="dialog" aria-label="Ready to Assign ${fmt(
        s.rta,
      )}. Open breakdown and actions">
        <div class="more"><span class="txt">Breakdown</span>${I.chevD}</div>
        <div class="label">Ready to Assign ${rtaBadge(k)}</div>
        <div class="value num">${fmt(s.rta)}</div>
        <div class="sub num">${sub}</div>
      </div>
      <div class="card stat">
        <div class="label">Assigned</div>
        <div class="value num">${fmt(s.assigned)}</div>
        <div class="sub">across ${all.length} categories</div>
      </div>
      <div class="card stat">
        <div class="label">Activity</div>
        <div class="value num">${fmt(s.activity)}</div>
        <div class="stackbar" aria-hidden="true">${top
          .map(
            ([c, v]) => `<i style="flex:${v};background:${accent(c.id)}"></i>`,
          )
          .join('')}${
          other
            ? `<i style="flex:${other};background:var(--pageTextFaint)"></i>`
            : ''
        }<i style="flex:${Math.max(
          0,
          s.assigned + s.activity,
        )};background:var(--progressTrack)"></i></div>
      </div>
    </section>
    <div class="card cstrip" aria-label="Month summary">
      <button class="cs-rta ${k}" data-menu="breakdown" data-for="${off}" data-anchor="breakdown:${off}"><span class="l">Ready to Assign</span><b class="num">${fmt(
        s.rta,
      )}</b>${rtaBadge(k)}${I.chevD}</button>
      <span class="cs-item"><span class="l">Assigned</span><b class="num">${fmt(
        s.assigned,
      )}</b></span>
      <span class="cs-item"><span class="l">Activity</span><b class="num">${fmt(
        s.activity,
      )}</b></span>
    </div>`;
      }

      function nameCell(c) {
        const gi = goalInfo(c, panelOff());
        return `<div class="name" role="rowheader">
        <span class="drag" aria-hidden="true">${I.grip}</span>
        <button class="cname" data-open="${c.id}" data-anchor="catmenu:${
          c.id
        }" aria-label="${esc(c.n)}. Open details">${tile(
          c,
        )}<span class="ntext"><span class="nlabel">${esc(c.n)}</span>${
          gi ? `<span class="cap">${gi.text}</span>` : ''
        }</span>${
          c.notes
            ? `<span class="note-ind" aria-hidden="true">${I.note}</span>`
            : ''
        }${c.hidden ? '<span class="hid">Hidden</span>' : ''}</button>
        <span class="tools">
          <button class="tool ${c.notes ? 'on' : ''}" aria-label="${
            c.notes ? 'Notes: ' + esc(c.notes) : 'Add notes'
          }" title="${esc(c.notes || 'Add notes')}">${I.note}</button>
          <button class="tool" data-menu="catmenu" data-for="${
            c.id
          }" aria-label="${esc(c.n)} menu" aria-haspopup="menu">${
            I.dots
          }</button>
        </span>
      </div>`;
      }
      function monthCells(c, off, first) {
        const d = cell(c, off),
          p = progress(-d.s, d.avail),
          k = availKind(c, off),
          gi = goalInfo(c, off),
          key = `${c.id}:${off}`,
          multi = L.n > 1;
        const assigned =
          state.edit === key
            ? `<input class="amt-input num" data-edit="${key}" value="${d.b.toFixed(
                2,
              )}" inputmode="decimal" aria-label="Assigned to ${esc(
                c.n,
              )} in ${mLong(off)}">`
            : `<button class="assigned num ${
                d.b === 0 ? 'z' : ''
              }" data-edit-start="${key}" aria-label="Assigned ${fmt(
                d.b,
              )} in ${mName(off)}. Edit">${fmt(d.b)}</button>`;
        const act =
          d.s === 0
            ? `<span class="z">${fmt(0)}</span>`
            : d.s < 0
              ? `+${fmt(-d.s)}`
              : fmt(-d.s);
        const pct = p.over
          ? 'Over'
          : d.s > 0
            ? Math.round(p.fill * 100) + '%'
            : '';
        const arrow = c.roll
          ? `<span class="carry" title="Overspending rolls over to ${mName(
              off + 1,
            )}">${I.arrowR}</span>`
          : '';
        return `<div class="r ${first ? '' : 'mstart'}">${assigned}</div>
      <div class="act">
        <div class="t num"><button class="actlink" data-activity="${key}" aria-label="Activity ${act.replace(
          /<[^>]+>/g,
          '',
        )}. Show transactions">${act}</button>${
          multi ? '' : `<span class="pct">${pct}</span>`
        }</div>
        <div class="bar" aria-hidden="true"><i style="width:${
          p.fill * 100
        }%;background:${
          p.over ? 'var(--pillNegativeText)' : accent(c.id)
        }"></i></div>
      </div>
      <div class="r"><button class="pill ${k} num" data-menu="balance" data-for="${key}" data-anchor="balance:${key}" aria-haspopup="menu" aria-label="Available ${fmt(
        d.avail,
      )}${gi ? '. ' + gi.long : ''}${
        c.roll ? '. Overspending rolls over' : ''
      }. Open balance menu">${
        gi ? `<span class="gi" aria-hidden="true">${I.target}</span>` : ''
      }${fmt(d.avail)}${arrow}</button></div>`;
      }
      function catRow(c, offs) {
        if (c.hidden && !state.showHidden) return '';
        const cls = [
          'cols',
          'crow',
          c.id === state.cat && L.mode !== 'closed' ? 'sel' : '',
          state.hover === c.id ? 'hover' : '',
          c.hidden ? 'hidden-cat' : '',
          state.edit.startsWith(c.id + ':') ? 'editing' : '',
          goalInfo(c, panelOff()) ? 'has-cap' : '',
        ].join(' ');
        return `<div class="${cls}" role="row" style="${L.tpl}">${nameCell(
          c,
        )}${offs.map((o, i) => monthCells(c, o, i === 0)).join('')}</div>`;
      }
      function groupRow(g, offs) {
        const collapsed = state.collapsed.has(g.id);
        const cats = g.cats.filter(c => !c.hidden || state.showHidden);
        return `<div class="cols grow" role="row" style="${L.tpl}">
      <div class="name" role="rowheader"><button class="caret" data-collapse="${
        g.id
      }" aria-expanded="${!collapsed}" aria-label="${
        collapsed ? 'Expand' : 'Collapse'
      } ${esc(g.name)}">${
        collapsed ? I.chevR : I.chevD
      }</button><span class="gname">${esc(g.name)}</span>
        <span class="tools"><button class="tool" aria-label="Add category to ${esc(
          g.name,
        )}">${I.plus}</button><button class="tool" aria-label="Group notes">${
          I.note
        }</button><button class="tool" data-menu="groupmenu" data-for="${
          g.id
        }" data-anchor="groupmenu:${g.id}" aria-label="${esc(
          g.name,
        )} menu" aria-haspopup="menu">${I.dots}</button></span></div>
      ${offs
        .map((o, i) => {
          const b = sum(cats, c => cell(c, o).b),
            s = sum(cats, c => cell(c, o).s),
            a = sum(cats, c => cell(c, o).avail);
          return `<div class="r num ${i ? 'mstart' : ''}">${fmt(
            b,
          )}</div><div class="num gt">${fmt(
            -s,
          )}</div><div class="r"><span class="pill ${rtaKind(a)} num">${fmt(
            a,
          )}</span></div>`;
        })
        .join('')}
    </div>`;
      }
      function incomeRows(offs) {
        const collapsed = state.collapsed.has('inc');
        const head = `<div class="cols grow inc" role="row" style="${L.tpl}">
      <div class="name" role="rowheader"><button class="caret" data-collapse="inc" aria-expanded="${!collapsed}" aria-label="${
        collapsed ? 'Expand' : 'Collapse'
      } Income">${
        collapsed ? I.chevR : I.chevD
      }</button><span class="gname">Income</span><span class="rl" style="margin-left:auto">Received</span></div>
      ${offs
        .map(
          (o, i) =>
            `<div class="${
              i ? 'mstart' : ''
            }"></div><div></div><div class="r num">${fmt(
              sum(income, x => x.r[o] || 0),
            )}</div>`,
        )
        .join('')}
    </div>`;
        if (collapsed) return head;
        return (
          head +
          income
            .map(
              x => `<div class="cols crow irow" role="row" style="${L.tpl}">
      <div class="name" role="rowheader"><span class="drag" aria-hidden="true">${
        I.grip
      }</span><span class="cname static">${tile(
        x,
      )}<span class="ntext"><span class="nlabel">${esc(
        x.n,
      )}</span></span></span></div>
      ${offs
        .map(
          (o, i) =>
            `<div class="${
              i ? 'mstart' : ''
            }"></div><div></div><div class="r num ${x.r[o] ? '' : 'z'}">${fmt(
              x.r[o] || 0,
            )}</div>`,
        )
        .join('')}
    </div>`,
            )
            .join('')
        );
      }

      function ledger(offs) {
        const multi = offs.length > 1;
        const mh = multi
          ? `<div class="cols mhead" role="row" style="${
              L.tpl
            }"><div></div>${offs
              .map(
                (o, i) =>
                  `<div class="mh ${
                    i ? 'mstart' : ''
                  }" style="grid-column:span 3">${mLong(o)}${
                    o === 0 ? '<span class="today">Today</span>' : ''
                  }</div>`,
              )
              .join('')}</div>`
          : '';
        const ch = `<div class="cols lhead" role="row" style="${
          L.tpl
        }"><div class="ch-name">Category<button class="tool" data-menu="column" data-anchor="column" aria-label="Category column menu" aria-haspopup="menu">${
          I.dots
        }</button></div>${offs
          .map(
            (o, i) =>
              `<div class="r ${
                i ? 'mstart' : ''
              }">Assigned</div><div>Activity</div><div class="r">Available</div>`,
          )
          .join('')}</div>`;
        const body = g =>
          groupRow(g, offs) +
          (state.collapsed.has(g.id)
            ? ''
            : g.cats.map(c => catRow(c, offs)).join(''));
        if (state.layout === 'b' && !multi) {
          return `<div class="ledger-wrap" role="table" aria-label="Envelope budget">${ch}${groups
            .map(
              g => `<div class="card ledger" role="rowgroup">${body(g)}</div>`,
            )
            .join('')}<div class="card ledger" role="rowgroup">${incomeRows(
            offs,
          )}</div></div>`;
        }
        return `<div class="ledger-wrap card ${

      function paceSvg(c, off, pi) {
        const w = 320,
          h = 110,
          days = pi.days;
        let cum = 0;
        const steps = [[0, 0]];
        for (const t of pi.tx) {
          steps.push([t.day, cum]);
          cum += -t.amt;
          steps.push([t.day, cum]);
        }
        steps.push([pi.upto, cum]);
        const vals = steps.map(s => s[1]);
        const max = Math.max(pi.start, ...vals, 1) * 1.08,
          min = Math.min(0, ...vals);
        const x = d => (d / days) * w,
          y = v => h - 6 - ((v - min) / (max - min)) * (h - 14);
        const line = steps
          .map(
            ([d, v], i) =>
              `${i ? 'L' : 'M'}${x(d).toFixed(1)},${y(v).toFixed(1)}`,
          )
          .join(' ');
        const col = pi.d.avail < 0 ? 'var(--pillNegativeText)' : accent(c.id);
        const series =
          off > 0
            ? ''
            : `<path d="${line} L${x(pi.upto)},${h} L0,${h} Z" fill="url(#pg)"/>
          <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
        const even =
          pi.start > 0
            ? `<line x1="0" y1="${y(0)}" x2="${w}" y2="${y(
                pi.start,
              )}" stroke="var(--pageTextFaint)" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
          <line x1="0" y1="${y(pi.start)}" x2="${w}" y2="${y(
            pi.start,
          )}" stroke="var(--progressTrack)" stroke-width="1" vector-effect="non-scaling-stroke"/>`
            : '';
        const today =
          off === 0
            ? `<line x1="${x(pi.upto)}" y1="4" x2="${x(
                pi.upto,
              )}" y2="${h}" stroke="var(--pageTextFaint)" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`
            : '';
        return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${even}${series}${today}
    </svg>${
      off > 0
        ? '<div class="chart-empty"><span>No activity yet</span></div>'
        : ''
    }</div>`;
      }
      function paceSection(c, off, pi) {
        const d = pi.d;
        let summary;
        if (off > 0) {
          summary = `${fmt(Math.max(0, pi.start))} to spend from ${mAbbr(
            off,
          )} 1`;
        } else if (pi.start <= 0) {
          summary = 'Nothing assigned, so no pace line';
        } else if (off === 0 && pi.tx.length === 0) {
          summary = 'No activity yet this month';
        } else if (off < 0) {
          summary =
            d.avail >= 0
              ? `Finished with ${fmt(d.avail)} left`
              : `Finished ${fmt(-d.avail)} overspent`;
        } else {
          summary =
            pi.diff >= 0
              ? `${fmt(Math.round(pi.diff))} under even pace`
              : `${fmt(Math.round(-pi.diff))} over even pace`;
        }
        const text =
          off > 0
            ? `${mName(off)} has not started. ${summary}.`
            : `Spent ${fmt(pi.spent)} of ${fmt(
                Math.max(0, pi.start),
              )} by ${mAbbr(off)} ${pi.upto}. ${summary}.`;
        return `<div>
        <div class="sec-title">Pace <span>${mAbbr(off)} 1 – ${
          pi.days

        <div style="margin-top:8px" role="img" aria-label="${esc(text)}">${
          state.privacy

      const fmt2 = n =>

      function areaChart(pts, opts = {}) {
        const { color = 'var(--reportsPos)', fill = 0.16, cmp, pad = 0 } = opts;
        const all = cmp ? pts.concat(cmp) : pts;
        const min = opts.min ?? Math.min(...all),
          max = opts.max ?? Math.max(...all);
        const y = v =>
          40 - pad - ((v - min) / (max - min || 1)) * (40 - 2 * pad);
        const path = s =>
          s
            .map(
              (v, i) =>
                `${i ? 'L' : 'M'}${((i / (s.length - 1)) * 100).toFixed(2)},${y(
                  v,
                ).toFixed(2)}`,
            )
            .join(' ');
        const d = path(pts);
        return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">

                  cmp,

              : ''
          }
          <path d="${d} L100,40 L0,40 Z" fill="${color}" fill-opacity="${fill}"/>
          <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
      }
      const cum = (arr, k = 1) => {

        );
