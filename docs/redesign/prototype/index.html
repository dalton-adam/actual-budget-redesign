<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Budget Prototype</title>
    <!--
  DESIGN-01/02 prototype: fictional data only, no connection to Actual's code.
  Open with a local file URL after `yarn install` (fonts load from node_modules).
  URL params: layout=a|b, header=cards|trend, theme=light|dark|midnight|custom,
  panel=0|1, privacy=0|1, controls=0|1, page=budget|account|reports|schedules|payees|rules|tags
  APP-03: rview=dash|networth|custom|calendar|formula, redit=0|1, whover=<widget id>
  APP-04 (page=schedules): sdlg=<schedule id>|add, stx=linked|matched, scompleted=0|1,
  sempty=0|1, sfilter=<text>, shover=<id>, smenu=<id>, ssel=0|1
  APP-05a (page=payees): psel=0|1, pmenu=0|1, punused=0|1, pempty=0|1, pfilter=<text>,
  phover=<id>, prow=<id> (row context menu)
  APP-05b (page=rules): rusel=0|1, ruempty=0|1, rufilter=<text>, ruhover=<id>,
  rumenu=<id> (row context menu)
  APP-05c (page=tags): tsel=0|1, tmenu=0|1, tdots=0|1, tadd=0|1, thidden=0|1, tempty=0|1,
  tfilter=<text>, thover=<id>, trow=<id> (row context menu)
  APP-05d (page=settings): sadv=0|1 (advanced shown, scrolled to), sexp=0|1 (experimental
  features listed), sauto=0|1 (theme follows the system), sserver=0|1 (a sync server),
  stmenu=theme (the theme menu open)
  APP-03c: rgraph=table|bar|stacked|line|area|donut, rlegend=0|1, rsummary=0|1, rlabels=0|1
  DESIGN-02: data=basic|states|many, density=50|44|38, rta=pos|zero|neg,
  when=past|current|future, cat=<category id>, pm=<panel month>, hover=<id>, edit=<id>:<month>,
  compact=1, hidden=0, collapsed=<group ids>, pane=open|collapsed, recon=0|diff|done,
  filter=<id>:<month>, menu=accounts|more|budget|drawer|breakdown|balance|
  catmenu|groupmenu|month|column|recon with for=<anchor id>
-->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Redacted Script';
        src: url('../../../node_modules/@fontsource/redacted-script/files/redacted-script-latin-400-normal.woff2')
          format('woff2');
      }

      /*
   * Proposed Stage 2 theme roles. Names mirror Actual's camelCase theme keys.
   * Existing-role equivalents are noted where one exists.
   */
      :root,
      [data-theme='light'] {
        --pageBackground: #f4f4f7; /* existing: pageBackground */
        --pageGlow: radial-gradient(
          1100px 420px at 8% -18%,
          rgba(135, 25, 224, 0.07),
          transparent 60%
        );
        --pageText: #15151c; /* existing: pageText */
        --pageTextSubdued: #62626e; /* existing: pageTextSubdued */
        --pageTextFaint: #8d8d99;
        --cardBackground: #ffffff; /* existing: cardBackground */
        --cardBorder: rgba(15, 15, 30, 0.07);
        --cardShadow:
          0 1px 2px rgba(15, 15, 30, 0.04), 0 10px 28px rgba(15, 15, 30, 0.05);
        --cardInset: #f6f6f9;
        --controlBackground: #ffffff;
        --navTrack: rgba(15, 15, 30, 0.05);
        --navActive: #ffffff;
        --navActiveShadow: 0 1px 3px rgba(15, 15, 30, 0.12);
        --accent: #8719e0; /* existing: buttonPrimaryBackground */
        --selectionBackground: rgba(135, 25, 224, 0.06);
        --selectionBorder: #8719e0;
        --tableRowHover: rgba(15, 15, 30, 0.025);
        --groupRowBackground: #fafafc;
        --progressTrack: rgba(15, 15, 30, 0.07);
        --pillPositiveBackground: rgba(20, 125, 100, 0.11);
        --pillPositiveText: #0f6e57; /* derived from numberPositive #147d64 for AA on tint */
        --pillNeutralBackground: rgba(15, 15, 30, 0.05);
        --pillNeutralText: #6b6b76;
        --pillNegativeBackground: rgba(225, 45, 57, 0.11);
        --pillNegativeText: #c21f2c; /* numberNegative */
        --heroGlow: rgba(20, 125, 100, 0.12);
        --popoverShadow:
          0 16px 40px rgba(15, 15, 30, 0.16), 0 2px 6px rgba(15, 15, 30, 0.06);
        --scrim: rgba(15, 15, 30, 0.28);
        --categoryAccent1: #6366f1;
        --categoryAccent2: #10b981;
        --categoryAccent3: #d97706;
        --categoryAccent4: #3b82f6;
        --categoryAccent5: #db2777;
        --categoryAccent6: #ea580c;
        --categoryAccent7: #0891b2;
        --categoryAccent8: #7c3aed;
        --categoryAccent9: #65a30d;
        --categoryAccent10: #e11d48;
        --tileAlpha: 0.13;
      }
      [data-theme='dark'] {
        --pageBackground: #0b0b0f;
        --pageGlow:
          radial-gradient(
            1100px 460px at 12% -12%,
            rgba(129, 140, 248, 0.13),
            transparent 60%
          ),
          radial-gradient(
            800px 420px at 100% -5%,
            rgba(236, 72, 153, 0.06),
            transparent 60%
          );
        --pageText: #f4f4f6;
        --pageTextSubdued: #a3a3ad;
        --pageTextFaint: #74747f;
        --cardBackground: #141419;
        --cardBorder: rgba(255, 255, 255, 0.065);
        --cardShadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 18px 36px rgba(0, 0, 0, 0.32);
        --cardInset: rgba(255, 255, 255, 0.04);
        --controlBackground: #16161c;
        --navTrack: #141419;
        --navActive: rgba(255, 255, 255, 0.1);
        --navActiveShadow: none;
        --accent: #a78bfa;
        --selectionBackground: rgba(129, 140, 248, 0.11);
        --selectionBorder: #818cf8;
        --tableRowHover: rgba(255, 255, 255, 0.025);
        --groupRowBackground: rgba(255, 255, 255, 0.02);
        --progressTrack: rgba(255, 255, 255, 0.075);
        --pillPositiveBackground: rgba(74, 222, 128, 0.13);
        --pillPositiveText: #4ade80;
        --pillNeutralBackground: rgba(255, 255, 255, 0.06);
        --pillNeutralText: #a3a3ad;
        --pillNegativeBackground: rgba(248, 113, 113, 0.15);
        --pillNegativeText: #f87171;
        --heroGlow: rgba(74, 222, 128, 0.2);
        --popoverShadow:
          0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --scrim: rgba(0, 0, 0, 0.5);
        --categoryAccent1: #818cf8;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #60a5fa;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #a78bfa;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.17;
      }
      [data-theme='midnight'] {
        --pageBackground: #0a0812;
        --pageGlow: radial-gradient(
          1100px 460px at 12% -12%,
          rgba(135, 25, 224, 0.2),
          transparent 60%
        );
        --pageText: #efeaf8;
        --pageTextSubdued: #a59cba;
        --pageTextFaint: #766e8a;
        --cardBackground: #13101d;
        --cardBorder: rgba(200, 170, 255, 0.08);
        --cardShadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 18px 36px rgba(0, 0, 0, 0.4);
        --cardInset: rgba(200, 170, 255, 0.05);
        --controlBackground: #15111f;
        --navTrack: #13101d;
        --navActive: rgba(163, 104, 252, 0.2);
        --navActiveShadow: none;
        --accent: #b58cff;
        --selectionBackground: rgba(163, 104, 252, 0.13);
        --selectionBorder: #a368fc;
        --tableRowHover: rgba(200, 170, 255, 0.03);
        --groupRowBackground: rgba(200, 170, 255, 0.03);
        --progressTrack: rgba(200, 170, 255, 0.09);
        --pillPositiveBackground: rgba(74, 222, 128, 0.13);
        --pillPositiveText: #4ade80;
        --pillNeutralBackground: rgba(200, 170, 255, 0.07);
        --pillNeutralText: #a59cba;
        --pillNegativeBackground: rgba(248, 113, 113, 0.15);
        --pillNegativeText: #f87171;
        --heroGlow: rgba(74, 222, 128, 0.18);
        --popoverShadow:
          0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(200, 170, 255, 0.08);
        --scrim: rgba(0, 0, 0, 0.55);
        --categoryAccent1: #a5b4fc;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #7dd3fc;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #c4b5fd;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.18;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-feature-settings: 'ss01', 'ss04';
        background: var(--pageGlow), var(--pageBackground);
        background-attachment: fixed;
        color: var(--pageText);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .num {
        font-feature-settings: 'tnum', 'ss01', 'ss04';
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      body.privacy .num {
        font-family: 'Redacted Script', sans-serif;
        letter-spacing: 0;
      }
      :focus-visible {
        outline: 2px solid var(--selectionBorder);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* Prototype controls (not part of the design) */
      .proto {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 14px;
        background: #1d1d24;
        color: #ddd;
        font-size: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
      }
      .proto b {
        color: #888;
        font-weight: 600;
        margin-right: 4px;
      }
      .proto button {
        padding: 4px 8px;
        border-radius: 7px;
        color: #bbb;
      }
      .proto button.on {
        background: #8719e0;
        color: #fff;
      }
      .proto .grp {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      body.no-controls .proto {
        display: none;
      }

      /* App frame */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 60px;
        padding: 0 24px;
        flex-shrink: 0;
        position: relative;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: white;
        font-size: 13px;
        font-weight: 800;
      }
      [data-theme='dark'] .brand-mark,
      [data-theme='midnight'] .brand-mark {
        color: #1a1030;
      }
      .nav {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 13px;
        background: var(--navTrack);
        border: 1px solid var(--cardBorder);
      }
      [data-theme='light'] .nav {
        border-color: transparent;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--pageTextSubdued);
        position: relative;
      }
      .nav button:hover {
        color: var(--pageText);
      }
      .nav button.on {
        background: var(--navActive);
        color: var(--pageText);
        font-weight: 600;
        box-shadow: var(--navActiveShadow);
      }
      .nav button.open {
        color: var(--pageText);
        background: var(--tableRowHover);
      }
      .nav .chev {
        opacity: 0.6;
      }
      .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--pageTextSubdued);
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
        position: relative;
      }
      .icon-btn:hover {
        color: var(--pageText);
      }
      .icon-btn.burger {
        display: none;
      }
      .uncat {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--pageText);
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
      }
      .uncat .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--categoryAccent3);
      }
      .sync-dot {
        position: absolute;
        right: 6px;
        top: 6px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pillPositiveText);
        box-shadow: 0 0 0 2px var(--controlBackground);
      }
      .switcher {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px 0 5px;
        border-radius: 10px;
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
        font-size: 13px;
        font-weight: 600;
      }
      .switcher .av {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--selectionBackground);
        color: var(--accent);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
      }

      /* Popovers */
      .pop {
        position: absolute;
        top: 52px;
        z-index: 30;
        min-width: 220px;
        padding: 6px;
        border-radius: 16px;
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        box-shadow: var(--popoverShadow);
        display: none;
      }
      .pop.show {
        display: block;
      }
      .pop .sec {
        padding: 8px 10px 4px;
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pageTextFaint);
        display: flex;
        justify-content: space-between;
      }
      .pop .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13.5px;
        text-align: left;
      }
      .pop .item:hover,
      .pop .item.hl {
        background: var(--tableRowHover);
      }
      .pop .item .amt {
        margin-left: auto;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .pop .item .amt.neg {
        color: var(--pillNegativeText);
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--cardBorder);
        margin: 6px 4px;
      }
      .pop .ico {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--cardInset);
        color: var(--pageTextSubdued);
        flex-shrink: 0;
      }
      .pop .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 10px 10px 8px;
      }
      .pop .total b {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .pop .muted {
        color: var(--pageTextFaint);
        font-size: 12px;
      }
      .pop .acct-status {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #pop-accounts {
        width: 320px;
      }
      #pop-more {
        width: 230px;
      }
      #pop-budget {
        width: 230px;
        right: 24px;
      }

      /* Page */
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 18px;
        padding: 4px 24px 20px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .head {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .eyebrow {
        font-size: 12.5px;
        color: var(--pageTextFaint);
        font-weight: 500;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .head-controls {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: var(--controlBackground);
        border: 1px solid var(--cardBorder);
      }
      .seg > button {
        height: 30px;
        min-width: 30px;
        padding: 0 8px;
        border-radius: 9px;
        color: var(--pageTextSubdued);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
      }
      .seg > button:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .seg .label {
        padding: 0 10px;
        color: var(--pageText);
      }
      .months button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }
      [data-theme='light'] .months {
        background: var(--navTrack);
        border-color: transparent;
      }

      .card {
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        border-radius: 18px;
        box-shadow: var(--cardShadow);
      }

      /* Summary cards */
      .summary {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 12px;
        flex-shrink: 0;
      }
      .stat {
        padding: 16px 18px;
        position: relative;
        overflow: hidden;
      }
      .stat .label {
        font-size: 12.5px;
        color: var(--pageTextSubdued);
        font-weight: 500;
      }
      .stat .value {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-top: 4px;
      }
      .stat .sub {
        font-size: 12px;
        color: var(--pageTextFaint);
        margin-top: 3px;
      }
      .stat.hero {
        cursor: pointer;
      }
      .stat.hero::after {
        content: '';
        position: absolute;
        right: -70px;
        top: -90px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--heroGlow), transparent 65%);
        pointer-events: none;
      }
      .stat.hero .value {
        color: var(--pillPositiveText);
        font-size: 30px;
      }
      .stat.hero .more {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextSubdued);
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--cardInset);
      }
      .stackbar {
        display: flex;
        gap: 2px;
        height: 7px;
        margin-top: 12px;
        border-radius: 99px;
        overflow: hidden;
      }
      .stackbar i {
        display: block;
        height: 100%;
      }

      /* Trend header (Concept C) */
      .summary.trend {
        grid-template-columns: 1.55fr 1fr;
      }
      .trendcard {
        padding: 16px 18px 12px;
        display: flex;
        flex-direction: column;
      }
      .trendcard .row-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .delta {
        font-size: 12px;
        font-weight: 600;
        color: var(--pillPositiveText);
        background: var(--pillPositiveBackground);
        padding: 3px 8px;
        border-radius: 99px;
        vertical-align: middle;
        margin-left: 6px;
        letter-spacing: 0;
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--pageTextFaint);
        margin-top: 4px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 3px;
        border-radius: 2px;
        vertical-align: middle;
        margin-right: 5px;
      }
      .stack2 {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
      }
      .stack2 .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
      }
      .stack2 .stat .value {
        font-size: 24px;
      }
      .stack2 .stat.hero .value {
        font-size: 26px;
      }
      .ring {
        width: 54px;
        height: 54px;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      /* Ledger */
      .ledger-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        border-radius: 18px;
      }
      .ledger {
        overflow: hidden;
      }
      .cols {
        display: grid;
        grid-template-columns:
          minmax(160px, 1fr) 120px minmax(150px, 230px)
          120px;
        column-gap: 20px;

      /* ===================== DESIGN-02 additions ===================== */

      /* Warning pill: template underfunded (existing role templateNumberUnderFunded) */
      :root,
      [data-theme='light'] {
        --pillWarningBackground: rgba(217, 119, 6, 0.12);
        --pillWarningText: #a15c07;
        --heroGlowNegative: rgba(225, 45, 57, 0.1);
      }
      [data-theme='dark'] {
        --pillWarningBackground: rgba(251, 191, 36, 0.14);
        --pillWarningText: #fbbf24;
        --heroGlowNegative: rgba(248, 113, 113, 0.16);
      }
      [data-theme='midnight'] {
        --pillWarningBackground: rgba(251, 191, 36, 0.14);
        --pillWarningText: #fbbf24;
        --heroGlowNegative: rgba(248, 113, 113, 0.16);
      }

      /*
       * Custom theme test. A custom theme loads on top of a built-in base
       * (dark here) and overrides EXISTING roles only. The second half is the
       * proposed UI-01 fallback layer: every new role is derived from an
       * existing role, so the new surfaces follow the custom palette.
       */
      [data-theme='custom'] {
        /* What the custom theme itself sets (existing Actual roles) */
        --x-pageBackground: #002b36;
        --x-pageText: #eee8d5;
        --x-pageTextSubdued: #93a1a1;
        --x-cardBackground: #073642;
        --x-tableBorder: rgba(147, 161, 161, 0.2);
        --x-buttonPrimaryBackground: #b58900;
        --x-numberPositive: #859900;
        --x-numberNegative: #dc322f;
        --x-templateNumberUnderFunded: #cb4b16;

        /* Fallback layer: new roles expressed through existing ones */
        --pageBackground: var(--x-pageBackground);
        --pageGlow: none;
        --pageText: var(--x-pageText);
        --pageTextSubdued: var(--x-pageTextSubdued);
        --pageTextFaint: color-mix(
          in srgb,
          var(--x-pageTextSubdued) 70%,
          var(--x-pageBackground)
        );
        --cardBackground: var(--x-cardBackground);
        --cardBorder: var(--x-tableBorder);
        --cardShadow: none;
        --cardInset: color-mix(in srgb, var(--x-pageText) 6%, transparent);
        --controlBackground: var(--x-cardBackground);
        --navTrack: var(--x-cardBackground);
        --navActive: color-mix(in srgb, var(--x-pageText) 12%, transparent);
        --navActiveShadow: none;
        --accent: var(--x-buttonPrimaryBackground);
        --selectionBackground: color-mix(
          in srgb,
          var(--x-buttonPrimaryBackground) 16%,
          transparent
        );
        --selectionBorder: var(--x-buttonPrimaryBackground);
        --tableRowHover: color-mix(in srgb, var(--x-pageText) 4%, transparent);
        --groupRowBackground: color-mix(
          in srgb,
          var(--x-pageText) 3%,
          transparent
        );
        --progressTrack: color-mix(in srgb, var(--x-pageText) 10%, transparent);
        --pillPositiveBackground: color-mix(
          in srgb,
          var(--x-numberPositive) 18%,
          transparent
        );
        --pillPositiveText: var(--x-numberPositive);
        --pillNeutralBackground: color-mix(
          in srgb,
          var(--x-pageText) 8%,
          transparent
        );
        --pillNeutralText: var(--x-pageTextSubdued);
        --pillNegativeBackground: color-mix(
          in srgb,
          var(--x-numberNegative) 18%,
          transparent
        );
        --pillNegativeText: var(--x-numberNegative);
        --pillWarningBackground: color-mix(
          in srgb,
          var(--x-templateNumberUnderFunded) 18%,
          transparent
        );
        --pillWarningText: var(--x-templateNumberUnderFunded);
        --heroGlow: transparent;
        --heroGlowNegative: transparent;
        --popoverShadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        --scrim: rgba(0, 0, 0, 0.5);
        /* Category accents are not overridden: the built-in dark set shows */
        --categoryAccent1: #818cf8;
        --categoryAccent2: #34d399;
        --categoryAccent3: #fbbf24;
        --categoryAccent4: #60a5fa;
        --categoryAccent5: #f472b6;
        --categoryAccent6: #fb923c;
        --categoryAccent7: #22d3ee;
        --categoryAccent8: #a78bfa;
        --categoryAccent9: #a3e635;
        --categoryAccent10: #fb7185;
        --tileAlpha: 0.17;
      }
      [data-theme='custom'] .brand-mark,
      [data-theme='custom'] .tbtn.primary {
        color: #002b36;
      }

      /* Controls bar wraps on small windows */
      .proto {
        flex-wrap: wrap;

        row-gap: 6px;
      }
      .proto button[data-reload] {
        color: #888;
      }

      /* Density. Tiles and pills shrink with the row. */
      .d50 .crow {
        height: 50px;
      }
      .d44 .crow {
        height: 44px;
      }
      .d38 .crow {
        height: 38px;
      }
      .d44 .grow {
        height: 40px;
      }
      .d38 .grow {
        height: 34px;
      }
      .d44 .crow .tile {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        font-size: 12px;
      }
      .d38 .crow .tile {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        font-size: 11px;
      }
      .d38 .pill {
        padding: 2px 9px;
        font-size: 12px;
      }
      .d38 .bar {
        height: 4px;
      }
      .d38 .act {
        gap: 3px;
      }
      .d38 .act .t {
        font-size: 12px;
      }
      .d38 .crow .cap {
        display: none;
      }
      .d38 .crow .name {
        gap: 9px;
      }

      /* Category name cell: dedicated details opener, tools on hover */
      .crow .name,
      .grow .name {
        position: relative;
      }
      .cname {
        display: flex;
        align-items: center;
        gap: inherit;
        min-width: 0;
        flex: 1;
        text-align: left;
        border-radius: 8px;
        padding: 2px 0;
      }
      .cname.static {
        cursor: default;
      }
      .crow .name .ntext {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.2;
      }
      .crow .name .nlabel {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crow .name span {
        white-space: nowrap;
      }
      .cname:hover .nlabel {
        text-decoration: underline;
        text-decoration-color: var(--pageTextFaint);
        text-underline-offset: 3px;
      }
      .cap {
        font-size: 11px;
        font-weight: 500;
        color: var(--pageTextFaint);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hid {
        font-size: 10.5px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--pageTextFaint);
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--cardInset);
        flex-shrink: 0;
      }
      .crow.hidden-cat .name,
      .crow.hidden-cat .r,
      .crow.hidden-cat .act {
        opacity: 0.5;
      }
      .drag {
        position: absolute;
        left: 2px;
        color: var(--pageTextFaint);
        opacity: 0;
        display: grid;
        cursor: grab;
      }
      /* Row tools take no width until hover or keyboard focus */
      .tools {
        display: none;
        gap: 2px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .crow:hover .tools,
      .crow.hover .tools,
      .crow:focus-within .tools,
      .grow:hover .tools,
      .grow:focus-within .tools {
        display: flex;
      }
      .note-ind {
        display: grid;
        color: var(--pageTextFaint);
        flex-shrink: 0;
      }
      .crow:hover .note-ind,
      .crow.hover .note-ind,
      .crow:focus-within .note-ind {
        display: none;
      }
      .tool {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: var(--pageTextFaint);
        opacity: 0;
      }
      .tool:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .tool.on {
        opacity: 1;
        color: var(--pageTextSubdued);
      }
      .crow:hover .tool,
      .crow.hover .tool,
      .crow:focus-within .tool,
      .grow:hover .tool,
      .grow:focus-within .tool,
      .lhead .tool,
      .mcard .tool,
      .acct-rail .tool,
      .crow:hover .drag,
      .crow.hover .drag {
        opacity: 1;
      }
      .crow.hover {
        background: var(--tableRowHover);
      }
      .crow.hover .assigned {
        box-shadow: inset 0 0 0 1px var(--cardBorder);
        background: var(--controlBackground);
      }
      .crow .assigned {
        cursor: text;
      }
      .assigned.z,
      .z {
        color: var(--pageTextFaint);
      }
      .ch-name {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ch-name .tool {
        width: 20px;
        height: 20px;
      }
      .grow .gname {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .caret {
        border-radius: 6px;
        height: 20px;
      }
      .caret:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }

      /* Editing the Assigned amount */
      .amt-input {
        width: 100%;
        max-width: 110px;
        height: 30px;
        text-align: right;
        font: inherit;
        font-weight: 600;
        color: var(--pageText);
        background: var(--controlBackground);
        border: 1.5px solid var(--selectionBorder);
        border-radius: 8px;
        padding: 0 8px;
        outline: 3px solid var(--selectionBackground);
        font-feature-settings: 'tnum';
      }
      .d38 .amt-input {
        height: 26px;
      }
      .crow.editing {
        background: var(--selectionBackground);
      }

      /* Activity link, pills, goal and carryover markers */
      .actlink {
        border-radius: 6px;
      }
      .actlink:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      button.pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 650;
      }
      button.pill:hover {
        box-shadow: inset 0 0 0 1px currentColor;
      }
      .pill.warn {
        background: var(--pillWarningBackground);
        color: var(--pillWarningText);
      }
      .pill .gi,
      .pill .carry {
        display: inline-grid;
        opacity: 0.85;
      }
      .goalbox {
        padding: 11px 12px;
        border-radius: 12px;
        background: var(--cardInset);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gb-top {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .goalbox.under .gb-top {
        color: var(--pillWarningText);
      }
      .goalbox.ok .gb-top {
        color: var(--pillPositiveText);
      }
      .gb-top .gi {
        display: grid;
      }
      .gb-sub {
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .goalbox .bar {
        height: 5px;
      }
      .flag {
        display: flex;
        gap: 7px;
        align-items: flex-start;
        margin-top: 6px;
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .flag svg {
        margin-top: 2px;
        flex-shrink: 0;
      }
      .big.neg {
        color: var(--pillNegativeText);
      }
      .big.zero {
        color: var(--pageTextSubdued);
      }

      /* Ready to Assign states */
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0;
        background: var(--pillNeutralBackground);
        color: var(--pillNeutralText);
        vertical-align: 1px;
      }
      .badge.neg {
        background: var(--pillNegativeBackground);
        color: var(--pillNegativeText);
      }
      .stat.hero.zero .value {
        color: var(--pageText);
      }
      .stat.hero.zero::after {
        display: none;
      }
      .stat.hero.neg .value {
        color: var(--pillNegativeText);
      }
      .stat.hero.neg::after {
        background: radial-gradient(
          circle,
          var(--heroGlowNegative),
          transparent 65%
        );
      }
      .stat.hero:focus-visible {
        outline-offset: 2px;
        border-radius: 18px;
      }

      /* Compact summary strip, shown once the table scrolls on short windows */
      .cstrip {
        display: none;
        align-items: center;
        gap: 22px;
        height: 46px;
        padding: 0 8px 0 6px;
        flex-shrink: 0;
        border-radius: 14px;
      }
      body.compact .summary.cards {
        display: none;
      }
      body.compact .cstrip {
        display: flex;
      }
      .cs-rta {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--cardInset);
      }
      .cstrip .l {
        font-size: 12.5px;
        color: var(--pageTextSubdued);
        font-weight: 500;
      }
      .cstrip b {
        font-size: 16px;
        font-weight: 700;
      }
      .cs-rta.pos b {
        color: var(--pillPositiveText);
      }
      .cs-rta.neg b {
        color: var(--pillNegativeText);
      }
      .cs-rta .badge {
        margin-left: 0;
      }
      .cs-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      /* Breakdown and anchored menus */
      .pop.apop {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 60;
        max-width: calc(100vw - 24px);
      }
      .bd {
        padding: 4px 4px 2px;
      }
      .bd-title {
        font-size: 12px;
        font-weight: 650;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 6px 6px 8px;
      }
      .bd-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 6px;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .bd-row .num {
        color: var(--pageText);
        font-weight: 550;
      }
      .bd-row.total {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid var(--cardBorder);
        font-weight: 650;
        color: var(--pageText);
        font-size: 14px;
      }
      .bd-row.total.pos .num {
        color: var(--pillPositiveText);
      }
      .bd-row.total.neg .num {
        color: var(--pillNegativeText);
      }

      /* Multi-month */
      .mstart {
        position: relative;
      }
      .mstart::before {
        content: '';
        position: absolute;
        left: calc(var(--gap, 20px) / -2);
        top: -40px;
        bottom: -40px;
        width: 1px;
        background: var(--cardBorder);
      }
      .cols {
        overflow: hidden;
      }
      .mhead {
        height: 34px;
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--cardBackground);
        font-size: 13px;
        font-weight: 650;
      }
      .multi .lhead {
        top: 34px;
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .today {
        font-size: 10.5px;
        font-weight: 650;
        padding: 2px 7px;
        border-radius: 99px;
        background: var(--selectionBackground);
        color: var(--accent);
        text-transform: none;
        letter-spacing: 0;
      }
      .msummary {
        display: grid;
        align-items: stretch;
        padding: 0 19px;
        flex-shrink: 0;
      }
      .ms-lead {
        align-self: center;
      }
      .ms-hint {
        font-size: 12px;
        color: var(--pageTextFaint);
        margin-top: 2px;
        max-width: 170px;
      }
      .mcard {
        padding: 10px 12px 11px;
        border-radius: 14px;
        margin-left: calc(var(--gap, 20px) / -2);
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .mcard.focus {
        box-shadow:
          var(--cardShadow),
          inset 0 0 0 1px var(--selectionBorder);
      }
      .mc-top {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .mc-tools {
        margin-left: auto;
        display: flex;
        gap: 2px;
      }
      .mc-rta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        text-align: left;
        border-radius: 8px;
        flex-wrap: wrap;
      }
      .mc-rta .l {
        font-size: 12px;
        color: var(--pageTextSubdued);
        width: 100%;
      }
      .mc-rta .v {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .mc-rta .badge {
        margin-left: 0;
      }
      .mcard.pos .v {
        color: var(--pillPositiveText);
      }
      .mcard.neg .v {
        color: var(--pillNegativeText);
      }
      .mc-line {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 11.5px;
        color: var(--pageTextFaint);
      }
      .multi .act .t {
        justify-content: flex-start;
      }
      @media (max-width: 1279px) {
        .msummary {
          padding: 0 15px;
        }
        .mc-rta .v {
          font-size: 18px;
        }
        .multi-month .ms-hint {
          display: none;
        }
        .multi-month .cols .pill {
          padding: 3px 8px;
          font-size: 12px;
        }
      }

      /* Income section */
      .grow.inc {
        margin-top: 0;
      }
      .rl {
        font-size: 11px;
        font-weight: 600;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-right: 6px;
      }
      .irow .r {
        font-weight: 550;
      }

      /* Details panel: rail and overlay modes for multi-month views */
      .page {
        position: relative;
      }
      .rail {
        width: 62px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        align-self: flex-start;
      }
      .rail-tile {
        border-radius: 10px;
      }
      .rail-label {
        writing-mode: vertical-rl;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextFaint);
        letter-spacing: 0.04em;
      }
      .detail.overlay {
        position: absolute;
        right: 24px;
        top: 62px;
        bottom: 20px;
        z-index: 25;
        box-shadow: var(--popoverShadow);
      }
      .d-head {
        min-width: 0;
      }
      .d-title {
        overflow-wrap: anywhere;
        line-height: 1.2;
      }
      .d-month {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        vertical-align: middle;
      }
      .d-month button {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .d-month button:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }
      .d-month b {
        color: var(--pageTextSubdued);
        font-weight: 600;
      }
      .chart {
        position: relative;
      }
      .chart-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--pageTextFaint);
      }
      .chart-empty span {
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--cardBackground);
        box-shadow: 0 0 0 1px var(--cardBorder);
      }
      .legend {
        flex-wrap: wrap;
        row-gap: 2px;
      }
      .legend span {
        white-space: nowrap;
      }
      .crow .name .ntext {
        min-width: 48px;
      }
      .multi .crow .cap {
        display: none;
      }
      .legend i.dash {
        width: 1px;
        height: 10px;
        background: var(--pageTextFaint);
      }
      .pace-sum {
        color: var(--pageTextSubdued);
        font-weight: 600;
      }
      .txn .amt.in {
        color: var(--pillPositiveText);
      }
      .muted {
        color: var(--pageTextFaint);
      }
      .linkbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        border-radius: 6px;
      }
      .head .seg button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }

      /* Pinned accounts rail (optional, replaces the sidebar's pin) */
      .acct-rail {
        width: 236px;
        flex-shrink: 0;
        padding: 10px 6px;
        overflow: auto;
        align-self: stretch;
      }
      .acct-rail.collapsed {
        width: 56px;
        padding: 10px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .ap-dot {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--pageTextSubdued);
        background: var(--cardInset);
      }
      .ap-dot:hover {
        color: var(--pageText);
        background: var(--tableRowHover);
      }
      .ap-dot .acct-status {
        position: absolute;
        right: -1px;
        top: -1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--cardBackground);
      }
      .acct-rail .ar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 8px 6px 10px;
        font-size: 13px;
      }
      .acct-rail .pop {
        position: static;
        display: block;
        box-shadow: none;
        border: 0;
        padding: 0;
        width: auto;
        min-width: 0;
        background: transparent;
      }
      .acct-rail .pop .item,
      .drawer .pop .item {
        white-space: nowrap;
      }
      .acct-rail .pop .item {
        padding: 7px 8px;
        font-size: 13px;
      }
      .pin-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 650;
        color: var(--pageTextSubdued);
        text-transform: none;
        letter-spacing: 0;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .pin-btn:hover {
        background: var(--tableRowHover);
        color: var(--pageText);
      }

      /* Reconciliation mode in the account hero */
      .recon {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--cardInset);
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .recon b {
        color: var(--pageText);
      }
      .recon-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .chip.neg {
        background: var(--pillNegativeBackground);
        color: var(--pillNegativeText);
      }
      .chip.neg b {
        color: inherit;
      }
      .acct-hero.reconciling {
        box-shadow:
          var(--cardShadow),
          inset 0 0 0 1.5px var(--selectionBorder);
      }
      .register.reconciling .clr-head {
        color: var(--accent);
      }
      .register.reconciling .clr.u {
        border-color: var(--accent);
      }
      .rc {
        width: 290px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .rc-input {
        height: 36px;
        border-radius: 10px;
        border: 1.5px solid var(--selectionBorder);
        background: var(--controlBackground);
        color: var(--pageText);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-align: right;
        padding: 0 10px;
      }
      .rc-bank {
        text-align: right;
        font-size: 12px;
      }
      .rc-bank b {
        color: var(--pageText);
      }
      .rc-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .filter-pill button {
        display: grid;
        place-items: center;
        border-radius: 99px;
        width: 18px;
        height: 18px;
      }
      @media (max-width: 1279px) {
        .recon-actions {
          margin-left: 0;
        }
        .acct-rail {
          width: 210px;
        }
      }
      @media (max-width: 899px) {
        .rail {
          display: none;
        }
        .cstrip .cs-item:last-child {
          display: none;
        }
      }
      /* Accounts pane and details panel both open: narrower Activity */
      @media (min-width: 1280px) {
        body.pane-open.panel-open .cols {
          grid-template-columns:
            minmax(150px, 1fr) 104px minmax(100px, 170px)
            108px;
          column-gap: 16px;
        }
        body.pane-open.panel-open .act .t .pct {
          display: none;
        }
      }
      @media (max-width: 1279px) and (min-width: 900px) {
        body.panel-open .cols {
          grid-template-columns:
            minmax(120px, 1fr) 84px minmax(72px, 120px)
            92px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .bar i {
          transition: width 0.2s ease;
        }
      }

      /*
   * APP-03 proposal: Reports. Chart and amount colours are Actual's existing
   * reports* and number roles, unchanged (owner decision, September 30, 2026).
   * Widget cards are hairline only, with no shadow (same decision).
   */
      :root,
      [data-theme='light'] {
        --reportsPos: #147d64; /* reportsNumberPositive = numberPositive */
        --reportsNeg: #e12d39; /* reportsNumberNegative = numberNegative */
        --reportsGreen: #3ebd93;
        --reportsRed: #f86a6a;
        --reportsGray: #747c8b;
      }
      [data-theme='dark'],
      [data-theme='midnight'] {
        --reportsPos: #65d6ad;
        --reportsNeg: #ff9b9b;
      }
      [data-theme='custom'] {
        --reportsPos: var(--x-numberPositive);
        --reportsNeg: var(--x-numberNegative);
      }
      .rmain {
        overflow-y: auto;
        padding-right: 2px;
      }
      .rgrid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 88px;
        gap: 14px;

      .cf {

        align-items: flex-end;
        justify-content: center;

      .cf-col {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .cf-bar {
        width: 26px;
        border-radius: 6px 6px 2px 2px;

      .cf-col b {
        display: block;
        color: var(--pageText);

      }
      .cal {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 12px;
      }
      .cal-m {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .cal-h {

        gap: 8px;
        align-items: baseline;
        font-size: 12px;
        font-weight: 650;
      }
      .cal-h .num {
        font-size: 11.5px;
        font-weight: 600;
      }
      .cal-g {

      .cal-g .dow {

        right: 0;

      .md {

      }
      .grip-h {
        color: var(--pageTextFaint);

        vertical-align: -1px;
      }
      .rs {

        right: 6px;
        bottom: 6px;
        width: 10px;
        height: 10px;
        border-right: 2px solid var(--pageTextFaint);
        border-bottom: 2px solid var(--pageTextFaint);

      .rp-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .rp-tools .seg button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }
      [data-theme='light'] .rp-tools .seg {
        background: var(--navTrack);
        border-color: transparent;
      }
      .rp-tools .tbtn.on {
        background: var(--cardInset);
      }
      .rcard {
        padding: 16px 20px;
      }
      .rp-chart {

        flex-direction: column;
        flex-shrink: 0;

        min-height: 0;

        inset: 0;

        height: 100%;

      .rp-x {

        font-weight: 650;
        letter-spacing: -0.2px;

        align-items: center;
        gap: 6px;

        opacity: 0;
      }
      .rp-title-row:hover .tool,
      .rp-title-row:focus-within .tool {
        opacity: 1;
      }
      /* APP-03c proposal: custom report editor, Calendar list, Formula */
      .cr-body {

        grid-template-columns: 272px minmax(0, 1fr);
        gap: 14px;
        flex: 1;
        min-height: 0;
      }
      .cr-set {
        display: flex;
        flex-direction: column;
        padding: 0;
        min-height: 0;
        overflow: hidden;
      }
      .cr-sec {
        padding: 14px 16px;
        border-bottom: 1px solid var(--cardBorder);
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
      }
      .cr-sec h2,
      .fx-card h2 {
        font-size: 13.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cr-row {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);

        gap: 10px;

        padding: 0 10px;

      .seg.ico > button {
        width: 32px;
        padding: 0;
      }
      .seg.on-fill > button.on,
      .cr-set .seg > button.on,
      .fx-card .seg > button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);

      [data-theme='light'] .cr-set .seg,
      [data-theme='light'] .fx-card .seg {

      .cr-cats {

        overflow-y: auto;
        padding: 6px 8px 10px;

      .cr-cats-head {

        align-items: center;
        gap: 6px;
        padding: 10px 16px 4px;
        flex-shrink: 0;
      }
      .cr-cats-head h2 {
        font-size: 13.5px;
        font-weight: 600;
        margin-right: auto;

      .ck {

        align-items: center;
        gap: 9px;
        height: 30px;
        padding: 0 8px;
        border-radius: 8px;

      }
      .ck:hover {
        background: var(--tableRowHover);

      .ck.grp {
        font-weight: 600;

      }
      .ck.child {
        padding-left: 32px;
      }
      .ck.off {

      .ck .cb {
        margin-left: 0;

      .ck .cb.mixed {

        color: #fff;
      }
      .ck .cat-dot {
        margin-left: -2px;

      .cr-chart {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 20px;
        min-height: 0;
      }
      .cr-chart.no-side {
        grid-template-columns: minmax(0, 1fr);

      .cr-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

        align-items: flex-end;
        padding: 0 8px;
      }
      .bars > span {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .bars i {
        width: 56%;
        border-radius: 5px 5px 1px 1px;
        display: block;

      .bars-x {
        grid-column: 2;
        display: flex;
        font-size: 11px;
        color: var(--pageTextFaint);

      .bars-x span {

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

      .cr-side {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        border-left: 1px solid var(--cardBorder);

      .stat {
        background: var(--cardInset);
        border-radius: 10px;
        padding: 8px 10px;

      .stat .k {
        font-size: 12px;
        color: var(--pageTextSubdued);
        font-weight: 600;
      }
      .stat .v {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;

      .lg {

        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        min-height: 0;

      .lg-row {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        height: 28px;
        font-size: 12.5px;

      .lg-row i {
        width: 10px;
        height: 10px;
        border-radius: 3px;

      .lg-row .num {
        color: var(--pageTextSubdued);

      .rp-tools .vsep {

      .tbtn.ico {

      .tbtn[aria-pressed='true'] {

      .tbtn[aria-pressed='false'] {
        color: var(--pageTextSubdued);

      .saved {

        font-weight: 600;
        color: var(--pageTextSubdued);

        gap: 6px;

        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pillWarningText);

      .cal-tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr)) 220px;
        gap: 14px;
        flex-shrink: 0;

      .cal-tiles .cal-d {

      .cal-tot {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cal-reg {
        flex: 1;
        min-height: 280px;
        overflow: auto;
        padding: 0;
      }
      .calcols {
        display: grid;
        grid-template-columns:

        align-items: center;
        column-gap: 12px;
        padding: 0 14px 0 16px;

        border-radius: 18px 18px 0 0;

      .acct-cell {

      .sort-on {

        display: inline-flex;
        align-items: center;
        gap: 4px;

      .fx-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
      }
      .fx-col {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;

      .fx-card {
        display: flex;
        flex-direction: column;
        gap: 10px;

        letter-spacing: -0.8px;

      .code {

        border: 1px solid var(--cardBorder);
        border-radius: 10px;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        overflow: hidden;

      .code .ln {
        color: var(--pageTextFaint);
        text-align: right;
        padding: 10px 8px 10px 0;
        border-right: 1px solid var(--cardBorder);

      .code .src {
        padding: 10px 12px;
        white-space: pre;
        overflow-x: auto;
      }
      .code.one {
        grid-template-columns: minmax(0, 1fr);
      }
      .code .fn {
        color: var(--accent);
        font-weight: 600;
      }
      .code .str {
        color: var(--pillPositiveText);
      }

        display: flex;
        flex-wrap: wrap;
        gap: 18px 28px;
        align-items: flex-start;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextSubdued);
      }
      .fld input {
        height: 30px;
        width: 88px;
        border-radius: 9px;
        border: 1px solid var(--cardBorder);
        background: var(--controlBackground);
        color: var(--pageText);
        padding: 0 10px;
        font: inherit;
        font-weight: 500;
        font-size: 13px;
      }
      .sw {
        margin-top: 5px;
        width: 34px;
        height: 20px;
        border-radius: 99px;
        background: var(--accent);
        position: relative;
        display: inline-block;
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        right: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;

      .help {
        font-size: 12px;
        color: var(--pageTextSubdued);
        line-height: 1.5;
      }
      .qd {

        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;

        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
      }

        height: 26px;
      }
      .qd-top .tool:first-of-type {
        margin-left: auto;
      }
      .qd-meta {
        font-size: 12px;
        color: var(--pageTextSubdued);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;

      .qd .code {
        font-size: 11.5px;
        line-height: 1.5;
      }
      .qd .code .src {
        padding: 4px 8px;

      @media (max-width: 1279px) {

        .cr-side {

          padding-left: 0;
          border-top: 1px solid var(--cardBorder);

          gap: 10px 14px;

          column-gap: 24px;

          grid-auto-columns: 340px;
          overflow-x: auto;

        .calcols {
          grid-template-columns:
            84px minmax(90px, 1fr) minmax(110px, 1.2fr) minmax(70px, 0.8fr)
            minmax(100px, 1fr) 84px 84px 26px;
          column-gap: 10px;
        }
        .calcols .payee-cell .payee {
          display: none;

        .fx-body {
          grid-template-columns: minmax(0, 1fr);
        }

      /* APP-03d proposal: Monte Carlo */
      .mc-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex-shrink: 0;
      }
      .mc-card h2 {
        font-size: 13.5px;
        font-weight: 600;
      }
      .mc-top {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .mc-top .tbtn,
      .mc-top .ckl {
        margin-left: auto;
      }
      .mc-card .seg > button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }
      [data-theme='light'] .mc-card .seg {
        background: var(--navTrack);
        border-color: transparent;
      }
      .mc-desc {

        gap: 16px 0;

        border-left: 0;

      .mc-grp .ey,
      .mc-x .ey {

        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .mc-fields {
        display: flex;
        gap: 14px;
        align-items: flex-end;

        align-items: center;
        gap: 5px;

      .fld input.wide {
        width: 120px;
      }
      .fld input::placeholder {

        color: var(--pageText);

      .mc-tbl {
        border: 1px solid var(--cardBorder);
        border-radius: 12px;
        overflow-x: auto;

      .mccols {

        border-radius: 8px;
        background: var(--cardInset);
        color: var(--pageText);
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .atst .x {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--pageTextSubdued);
        display: grid;
        place-items: center;
      }
      .atst .x:hover {
        background: var(--tableRowHover);
      }
      .atst .x.focus {
        outline: 2px solid var(--selectionBorder);
        outline-offset: 2px;
      }
      .atst .x svg {
        width: 10px;
        height: 10px;
      }
      /* Today's toast: a status tint, 3px top stripe, coloured text */
      .atst.old {
        display: block;
        padding: 14px 40px 14px 14px;
        border-radius: 8px;
        border: 0;
        border-top: 3px solid;
        box-shadow:
          0 15px 30px 0 rgba(0, 0, 0, 0.11),
          0 5px 15px 0 rgba(0, 0, 0, 0.08);
        line-height: 1.4;
      }
      .atst.old.message {
        background: color-mix(
          in srgb,
          var(--pillPositiveText) 14%,
          var(--cardBackground)
        );
        border-top-color: var(--pillPositiveText);
        color: var(--pillPositiveText);
      }
      .atst.old.warning {
        background: color-mix(
          in srgb,
          var(--pillWarningText) 14%,
          var(--cardBackground)
        );
        border-top-color: var(--pillWarningText);
        color: var(--pillWarningText);
      }
      .atst.old.error {
        background: color-mix(
          in srgb,
          var(--pillNegativeText) 14%,
          var(--cardBackground)
        );
        border-top-color: var(--pillNegativeText);
        color: var(--pillNegativeText);
      }
      .atst.old .ico {
        display: none;
      }
      .atst.old .body {
        gap: 10px;
      }
      .atst.old .ttl,
      .atst.old .msg a,
      .atst.old .act,
      .atst.old .x {
        color: inherit;
      }
      .atst.old .ttl {
        font-size: 13px;
        font-weight: 700;
      }
      .atst.old .act {
        background: transparent;
        border-color: currentColor;
        border-radius: 4px;
        font-weight: 400;
      }
      .atst.old .x {
        opacity: 0.7;
      }
      .atst.old pre {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 4px;
      }
      /* APP-06d: loading, error and empty states. .old draws today's look. */
      .ast-page {
        flex: 1;
        min-height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .ast-spin {
        width: 20px;
        height: 20px;
        color: var(--pageTextSubdued);
      }
      @media (prefers-reduced-motion: no-preference) {
        .ast-spin {
          animation: adlg-spin 0.9s linear infinite;
        }
      }
      .ast-load {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .ast-load .msg {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--pageTextSubdued);
      }
      .ast-load.old {
        gap: 40px;
      }
      .ast-load.old .msg {
        font-size: 18px;
        font-weight: 400;
        color: var(--pageText);
      }
      .ast-load.old .ast-spin {
        width: 25px;
        height: 25px;
        color: var(--pageText);
      }
      .ast-appload {
        position: fixed;
        inset: 0;
        z-index: 70;
        background:
          linear-gradient(
            150deg,
            var(--pageBackground),
            var(--pageBackground) 40%,
            transparent
          ),
          var(--pageBackground);
        display: flex;
        justify-content: center;
        padding-top: 200px;
      }
      .ast-err {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 520px;
      }
      .ast-err .ico {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--pillNegativeBackground);
        color: var(--pillNegativeText);
        margin-bottom: 14px;
      }
      .ast-err .ico svg {
        width: 18px;
        height: 18px;
      }
      .ast-err h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--pageText);
      }
      .ast-err pre {
        margin: 12px 0 0;
        padding: 10px 12px;
        max-width: 520px;
        border-radius: 8px;
        background: var(--cardInset);
        color: var(--pageTextSubdued);
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
        text-align: left;
        user-select: text;
      }
      .ast-btn {
        margin-top: 18px;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--cardBorder);
        background: var(--controlBackground);
        color: var(--pageText);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      .ast-btn:hover,
      .ast-btn.hl {
        background: var(--tableRowHover);
      }
      .ast-err.old h2 {
        font-weight: 500;
        color: var(--pillNegativeText);
      }
      .ast-err.old pre {
        margin-top: 10px;
        padding: 0;
        background: none;
        color: var(--pillNegativeText);
        text-align: center;
      }
      .ast-err.old .ubtn {
        margin-top: 15px;
      }
      /* Fatal error body inside the APP-06a dialog frame */
      .adlg.fatal {
        width: 500px;
      }
      .adlg .fatal-stack {
        margin: 0 0 4px;
        padding: 10px 12px;
        max-height: 140px;
        overflow: auto;
        border-radius: 8px;
        background: var(--cardInset);
        color: var(--pageTextSubdued);
        font:
          11.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
      }
      .adlg .fatal-btns {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      .adlg .fatal-btns .tlink {
        margin-right: auto;
        border: 0;
        background: none;
        padding: 4px 0;
        font: inherit;
        font-size: 12.5px;
        color: var(--pageTextSubdued);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .adlg a.ext {
        color: var(--pageText);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .adlg.old.fatal p {
        font-size: 15px;
        margin-bottom: 15px;
      }
      .adlg.old .fatal-old-stack {
        margin-top: 5px;
        height: 100px;
        overflow: auto;
        white-space: pre;
      }
      .adlg.old a.ext {
        color: var(--accent);
        text-decoration: none;
      }
      /* Empty account register */
      .ast-first {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 64px 24px 72px;
        text-align: center;
      }
      .ast-first .txt {
        max-width: 420px;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--pageTextSubdued);
      }
      .ast-first .txt strong {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
        color: var(--pageText);
      }
      .ast-first .ubtn {
        margin-top: 18px;
      }
      .ast-first .foot {
        margin-top: 14px;
        font-size: 12px;
        color: var(--pageTextSubdued);
      }
      .ast-first.old {
        padding: 75px 0 40px;
        border-top: 1px solid var(--cardBorder);
      }
      .ast-first.old .txt {
        max-width: 550px;
        font-size: 15px;
        line-height: 1.4;
        color: var(--pageText);
      }
      .ast-first.old .txt strong {
        display: inline;
        margin: 0;
        font-size: inherit;
        font-weight: 700;
      }
      .ast-first.old .ubtn {
        margin-top: 20px;
      }
      .ast-first.old .foot {
        margin-top: 20px;
        font-size: 13px;
      }
      .ast-none {
        padding: 40px 0;
        text-align: center;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .ast-none.old {
        padding: 20px 0 0;
        font-style: italic;
        color: var(--pageText);
      }
      /* Schedule dialog */
      .sdlg-scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .sdlg {
        width: min(780px, 100%);
        max-height: calc(100vh - 48px);
        overflow: auto;
        background: var(--cardBackground);
        border: 1px solid var(--cardBorder);
        border-radius: 18px;
        box-shadow: var(--popoverShadow);
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .sdlg-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sdlg-top h2 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sdlg-top .icon-btn {
        margin-left: auto;
        border: 0;
        background: transparent;
      }
      .sdlg .ey {
        font-size: 11px;
        font-weight: 650;
        color: var(--pageTextFaint);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .sdlg-sec {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 14px;
        border-top: 1px solid var(--cardBorder);
      }
      .sdlg-sec.first {
        border-top: 0;
        padding-top: 0;
      }
      .sgrid {
        display: grid;
        grid-template-columns: 1fr 1fr 1.15fr;
        gap: 12px;
      }
      .sfld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--pageTextSubdued);
        min-width: 0;
      }
      .sfld .lrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 16px;
      }
      .sin {
        height: 32px;
        border-radius: 9px;
        border: 1px solid var(--cardBorder);
        background: var(--controlBackground);
        color: var(--pageText);
        padding: 0 10px;
        display: flex;
        align-items: center;
        font-size: 13px;
        font-weight: 500;
        min-width: 0;
      }
      .sin.focus {
        border-color: var(--selectionBorder);

      }
      .sin .ph {
        color: var(--pageTextFaint);
      }
      .sin.num {
        justify-content: flex-end;
      }
      .opbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      .stwo {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px 16px;
        align-items: start;
      }
      .scol {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stwo .tbtn {
        justify-content: space-between;
        width: 100%;
        font-weight: 500;
      }
      .scheck {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 13px;
        font-weight: 500;
        color: var(--pageText);
      }
      .scheck .cb {
        margin: 1px 0 0;
        flex-shrink: 0;
      }
      .scheck small,
      .sfld .help {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 500;
        color: var(--pageTextSubdued);
      }
      .supc {
        background: var(--cardInset);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13px;
      }
      .supc .d {
        display: flex;
        justify-content: space-between;
        color: var(--pageText);
      }
      .supc .d span:last-child {
        color: var(--pageTextSubdued);
      }
      .srule {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        font-size: 12.5px;
        color: var(--pageTextSubdued);
      }
      .stx-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stx-top .seg > button {
        padding: 0 12px;
      }
      .stx-top .seg > button.on {
        background: var(--navActive);
        color: var(--pageText);
        box-shadow: var(--navActiveShadow);
      }
      [data-theme='light'] .stx-top .seg {
        background: var(--navTrack);
        border-color: transparent;
      }
      .stx-top .hint {
        font-size: 12.5px;
        color: var(--pageTextSubdued);
      }
      .stx-top > :last-child {
        margin-left: auto;
      }
      .stx {
        border: 1px solid var(--cardBorder);
        border-radius: 12px;
        overflow: hidden;
      }
      .stxcols {
        display: grid;
        grid-template-columns:
          30px 96px minmax(110px, 1fr) minmax(110px, 1.2fr)

        align-items: center;
        column-gap: 12px;
        padding: 0 14px 0 8px;
      }
      .stx .rhead {
        position: static;
        background: transparent;
      }
      .stx .trow:last-child {
        border-bottom: 0;
      }
      .stx .trow.selected {
        background: var(--selectionBackground);
      }
      .stx-empty {
        padding: 22px;
        text-align: center;
        font-size: 13px;
        color: var(--pageTextSubdued);
      }
      .sdlg-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 0 18px;
        margin-bottom: -18px;
        border-top: 1px solid var(--cardBorder);
        position: sticky;
        bottom: -18px;
        background: var(--cardBackground);
      }
      .sdlg .ey-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

        margin-left: auto;

      @media (max-width: 1279px) {
        .schcols {
          grid-template-columns:
            minmax(130px, 1.3fr) minmax(100px, 1fr) minmax(100px, 1fr)
            96px 112px 132px 70px 34px;
          column-gap: 10px;
        }
      }

      /* APP-05a: Payees page */
      .pay-main {
        overflow: hidden;
      }
      .pay-table {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .pay-table .rhead {
        border-radius: 18px 18px 0 0;
        flex-shrink: 0;
      }
      .paycols {
        display: grid;
        grid-template-columns: 34px 22px minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 10px;
        padding: 0 14px 0 10px;
      }
      .prow {
        height: 44px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--cardBorder);
        font-size: 13px;

      .prow.hover {
        background: var(--tableRowHover);
      }
      .prow.selected {
        background: var(--selectionBackground);
      }

        opacity: 0;

      .prow:hover .cb,
      .prow.selected .cb,
      .pay-table.has-sel .prow:not(.transfer) .cb {
        opacity: 1;

      .prow.transfer .cb {
        visibility: hidden;
      }

        color: var(--pageTextSubdued);

      }

        color: var(--pageTextFaint);

        height: 12px;
      }

        color: var(--accent);
      }
      .pmarks .nolearn {
        color: var(--pillWarningText);
      }

        gap: 6px;

        padding: 0 9px;
        border-radius: 7px;

        font-weight: 600;
        white-space: nowrap;
        color: var(--pageTextSubdued);
        border: 1px solid transparent;

        width: 10px;
        height: 10px;
      }

      .prow:hover .prule:not(.has),

        text-underline-offset: 2px;

      function ring(pct, color) {

      function trendSvg() {
        const w = 600,
          h = 96,
          days = 30;
        const cur = [
          [0, 1800],
          [1, 1830],
          [3, 1905],
          [6, 2040],
          [9, 2110],
          [12, 2180],
          [14, 2330],
          [18, 2380],
          [22, 2410],
          [26, 2440],
        ];
        const prev = [
          [0, 1800],
          [3, 1990],
          [7, 2260],
          [11, 2520],
          [15, 2790],
          [19, 3050],
          [23, 3310],
          [27, 3560],
          [30, 3720],
        ];
        const x = d => (d / days) * w,
          y = v => h - 6 - ((v - 1750) / (3800 - 1750)) * (h - 14);
        const p = a =>
          a
            .map(
              ([d, v], i) =>
                `${i ? 'L' : 'M'}${x(d).toFixed(1)},${y(v).toFixed(1)}`,
            )
            .join(' ');
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="margin-top:8px" role="img" aria-label="Spending this month is below last month's pace">
      <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--categoryAccent1)" stop-opacity=".35"/><stop offset="1" stop-color="var(--categoryAccent1)" stop-opacity="0"/></linearGradient></defs>
      <path d="${p(
        prev,
      )}" fill="none" stroke="var(--pageTextFaint)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path d="${p(cur)} L${x(26)},${h} L0,${h} Z" fill="url(#tg)"/>
      <path d="${p(
        cur,
      )}" fill="none" stroke="var(--categoryAccent1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
      }
